      uid: d.id,
      email: data.email || "",
      premium: data.premium === true || (data.premium === undefined && !!st.premium),
      premiumInfo: data.premiumInfo || st.premiumInfo || {},
      userSince: st.userSince || data.createdAt || "",
      lastSync: data.updatedAt || "",
      nBeds: st.nBeds || 0,
      nPlants: (st.hpPlants || []).length,
      nHarvest: (st.harvest || []).length,
      nDiary: (st.diary || []).length,
      acqSource: st.acquisitionSource || "direct",
      featureUsage: st.featureUsage || {},
    });
  });

  let plantCount = 0;
  try { plantCount = (await getCountFromServer(collection(db, "plant_db"))).data().count || 0; } catch (e) {}
  const reqNew = missingReq ? [...missingReq.docs].filter(d => (d.data().status || "new") === "new").length : 0;
  const reqTotal = missingReq?.size || 0;
  const repNew = reports ? [...reports.docs].filter(d => (d.data().status || "new") === "new").length : 0;
  const forumPosts = forum?.size || 0;
  const totalReplies = forum ? [...forum.docs].reduce((s, d) => s + ((d.data().replies || []).length), 0) : 0;

  const uNow = Date.now();
  const uDays = (iso) => { if (!iso) return 99999; const t = new Date(iso).getTime(); return isNaN(t) ? 99999 : (uNow - t) / 86400000; };
  const uTotal = users.length;
  const uPrem = users.filter(u => u.premium).length;
  const uAct7 = users.filter(u => uDays(u.lastSync) <= 7).length;

  // Activity 14-day heatmap (z fóra + návrhů + hlášení)
  const activity = {};
  const now = new Date();
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    activity[d.toISOString().slice(0,10)] = 0;
  }
  const allDates = [];
  if (forum) forum.docs.forEach(d => allDates.push((d.data().createdAt || "").slice(0,10)));
  if (missingReq) missingReq.docs.forEach(d => allDates.push((d.data().createdAt || "").slice(0,10)));
  allDates.forEach(d => { if (d in activity) activity[d]++; });

  const maxA = Math.max(1, ...Object.values(activity));

  const uConv = uTotal ? (uPrem/uTotal*100) : 0;

  document.getElementById("kpi-grid").innerHTML = `
    <div class="kpi-hero-grid">
      <div class="kpi-hero" style="--kpi-glow:rgba(16,185,129,0.18);"><div class="kpi-hero-label">👥 Uživatelé celkem</div><div class="kpi-hero-val">${uTotal}</div><div class="kpi-hero-delta up">+${users.filter(u => uDays(u.userSince) <= 7).length} za posledních 7 dní</div></div>
      <div class="kpi-hero" style="--kpi-glow:rgba(245,158,11,0.18);"><div class="kpi-hero-label">💎 Premium</div><div class="kpi-hero-val">${uPrem}</div><div class="kpi-hero-delta ${uConv>=5?'up':''}">konverze ${uConv.toFixed(1)} %</div></div>
      <div class="kpi-hero" style="--kpi-glow:rgba(59,130,246,0.18);"><div class="kpi-hero-label">⚡ Aktivní (7 dní)</div><div class="kpi-hero-val">${uAct7}</div><div class="kpi-hero-delta">${uTotal?Math.round(uAct7/uTotal*100):0} % ze všech uživatelů</div></div>
      <div class="kpi-hero" style="--kpi-glow:rgba(139,92,246,0.18);"><div class="kpi-hero-label">📊 Aktivita (14 dní)</div><div class="kpi-hero-val">${Object.values(activity).reduce((s,n)=>s+n,0)}</div><div class="kpi-hero-delta">akcí ve fóru a návrzích</div></div>
    </div>
    <div class="kpi-mini-grid">
      <div class="kpi-mini"><span class="kpi-mini-icon">🌿</span><div><div class="kpi-mini-val">${plantCount}</div><div class="kpi-mini-label">Plant DB</div></div></div>
      <div class="kpi-mini"><span class="kpi-mini-icon">💬</span><div><div class="kpi-mini-val">${forumPosts}</div><div class="kpi-mini-label">Fórum · ${totalReplies} odp.</div></div></div>
      <div class="kpi-mini"><span class="kpi-mini-icon">📬</span><div><div class="kpi-mini-val" style="${reqNew?'color:var(--warning);':''}">${reqTotal}</div><div class="kpi-mini-label">${reqNew} čeká na vyřízení</div></div></div>
      <div class="kpi-mini"><span class="kpi-mini-icon">🚩</span><div><div class="kpi-mini-val" style="${repNew?'color:var(--danger);':''}">${repNew}</div><div class="kpi-mini-label">Hlášení nová</div></div></div>
    </div>
  `;

  // Activity bars
  document.getElementById("activity-chart").innerHTML = `
    <div class="bars">
      ${Object.entries(activity).map(([d, n]) => {
        const dt = new Date(d);
        const lbl = dt.getDate();
        return `<div class="bar" title="${d}: ${n} akcí"><div class="bar-val">${n||''}</div><div class="bar-fill" style="height:${Math.max(3, Math.round(n/maxA*120))}px"></div><div class="bar-lbl">${lbl}</div></div>`;
      }).join("")}
    </div>
  `;

  // Recent feed
  const recent = [];
  if (forum) forum.docs.slice(0,5).forEach(d => recent.push({ t: d.data().createdAt, icon: "💬", title: `Nové téma: ${d.data().title}`, sub: `od ${d.data().authorName || "?"} v ${d.data().category || "?"}` }));
  if (missingReq) missingReq.docs.slice(0,5).forEach(d => recent.push({ t: d.data().createdAt, icon: "📬", title: `Návrh: ${(d.data().text||"").slice(0,40)}`, sub: `${d.data().type || "?"} · ${d.data().userName || "anonymní"}` }));
  recent.sort((a,b) => (b.t||"").localeCompare(a.t||""));

  document.getElementById("recent-feed").innerHTML = recent.slice(0,10).map(r => `
    <div class="feed-item">
      <div class="feed-icon" style="background:var(--bg-2);">${r.icon}</div>
      <div class="feed-body">
        <div class="feed-title">${r.title.replace(/</g,"&lt;")}</div>
        <div class="feed-meta">${r.sub} · ${timeAgo(r.t)}</div>
      </div>
    </div>
  `).join("") || '<div style="padding:18px;color:var(--ink-3);text-align:center;">Žádná aktivita</div>';

  // Forum cats
  if (forum && forum.docs.length) {
    const cats = {};
    forum.docs.forEach(d => { const c = d.data().category || "?"; cats[c] = (cats[c]||0) + 1; });
    const sorted = Object.entries(cats).sort((a,b) => b[1]-a[1]);
    const maxC = sorted[0]?.[1] || 1;
    document.getElementById("forum-cats").innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${sorted.map(([c, n]) => `
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:140px;font-size:13px;color:var(--ink-2);">${c}</div>
            <div style="flex:1;height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden;">
              <div style="height:100%;width:${Math.round(n/maxC*100)}%;background:linear-gradient(90deg,#34d399,var(--primary));border-radius:99px;"></div>
            </div>
            <div style="width:42px;text-align:right;font-weight:700;font-size:13px;">${n}</div>
          </div>
        `).join("")}
      </div>
    `;
  } else {
    document.getElementById("forum-cats").innerHTML = '<div style="padding:14px;color:var(--ink-3);">Zatím žádná témata ve fóru</div>';
  }

  // ═══════════ SMART: RŮST & RETENCE ═══════════
  try {
    const now = new Date();
    const dAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d; };
    const within = (iso, days) => iso && new Date(iso) >= dAgo(days);
    const totalU = users.length;
    const new7 = users.filter(u => within(u.userSince, 7)).length;
    const new30 = users.filter(u => within(u.userSince, 30)).length;
    // Aktivní = synchronizoval v období
    const active7 = users.filter(u => within(u.lastSync, 7)).length;
    const active30 = users.filter(u => within(u.lastSync, 30)).length;
    // Retence: kolik % uživatelů starších 7 dní bylo aktivních za posledních 7 dní
    const eligible = users.filter(u => u.userSince && new Date(u.userSince) < dAgo(7));
    const retained = eligible.filter(u => within(u.lastSync, 7)).length;
    const retentionPct = eligible.length ? Math.round(retained / eligible.length * 100) : 0;
    // Engagement: aktivovaní = mají aspoň 1 záhon nebo sklizeň nebo deník
    const activated = users.filter(u => u.nBeds > 0 || u.nHarvest > 0 || u.nDiary > 0).length;
    const activationPct = totalU ? Math.round(activated / totalU * 100) : 0;
    const premiumPct = totalU ? Math.round(users.filter(u => u.premium).length / totalU * 100) : 0;

    const row = (label, val, sub, color) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft,var(--bg-2));">
      <div><div style="font-size:13px;color:var(--ink-2);">${label}</div>${sub?`<div style="font-size:11px;color:var(--ink-3);">${sub}</div>`:""}</div>
      <div style="font-size:18px;font-weight:800;color:${color||'var(--ink)'};">${val}</div></div>`;
    document.getElementById("admin-growth").innerHTML =
      row("👥 Uživatelů celkem", totalU, "", "var(--ink)") +
      row("🆕 Noví (7 dní)", "+" + new7, new30 + " za 30 dní", new7>0?"var(--primary)":"var(--ink-3)") +
      row("⚡ Aktivní (7 dní)", active7, active30 + " za 30 dní", "var(--ink)") +
      row("🔄 Retence 7d", retentionPct + "%", retained + " z " + eligible.length + " vrátilo", retentionPct>=40?"var(--primary)":retentionPct>=20?"var(--warning)":"var(--danger)") +
      row("🌱 Aktivace", activationPct + "%", "mají záhon/sklizeň/deník", activationPct>=50?"var(--primary)":"var(--warning)") +
      row("💎 Premium podíl", premiumPct + "%", "", "var(--ink)");
  } catch(e) { document.getElementById("admin-growth").innerHTML = '<div style="padding:14px;color:var(--ink-3);">Data uživatelů nedostupná</div>'; }

  // ═══════════ SMART: KOHORTOVÁ RETENCE ═══════════
  // "Retence 7d" výše je JEDNO číslo pro celou databázi právě teď — neříká,
  // jestli se to v čase zlepšuje nebo zhoršuje. Kohortová tabulka seskupí
  // uživatele podle týdne registrace a ukáže D1/D7/D14/D30 pro KAŽDÝ týden
  // zvlášť — tak je vidět trend (např. "lidé z posledních 3 týdnů se drží
  // líp než ti z května" = něco jsme mezitím zlepšili).
  try {
    const mondayOf = (d) => { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0,0,0,0); return x; };
    const now3 = new Date();
    const daysBetween2 = (a, b) => Math.round((b - a) / 86400000);
    const cohorts = {};
    users.forEach(u => {
      if (!u.userSince) return;
      const since = new Date(u.userSince);
      if (isNaN(since.getTime())) return;
      const key = mondayOf(since).toISOString().split("T")[0];
      if (!cohorts[key]) cohorts[key] = [];
      const last = u.lastSync ? new Date(u.lastSync) : since;
      cohorts[key].push({ since, daysActive: Math.max(0, daysBetween2(since, last)) });
    });
    const cohortWeeks = Object.keys(cohorts).sort((a, b) => b.localeCompare(a)).slice(0, 8); // posledních 8 týdnů, nejnovější nahoře
    const windows = [1, 7, 14, 30];
    const pctFor = (list, days) => {
      const eligible = list.filter(u => daysBetween2(u.since, now3) >= days);
      if (!eligible.length) return null; // kohorta ještě nemá na tohle okno "věk"
      const retained = eligible.filter(u => u.daysActive >= days).length;
      return Math.round(retained / eligible.length * 100);
    };
    const cellColor = (pct) => {
      if (pct === null) return "var(--bg-2)";
      if (pct >= 50) return "var(--primary)"; if (pct >= 30) return "#84cc16";
      if (pct >= 15) return "var(--warning)"; return "var(--danger)";
    };
    document.getElementById("admin-cohorts").innerHTML = cohortWeeks.length ? `
      <div class="cohort-scroll-hint">↔ posuň doprava pro D14 / D30</div>
      <div style="overflow-x:auto;" class="cohort-scroll-wrap">
      <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:480px;">
        <thead><tr>
          <th style="text-align:left;padding:6px 10px;color:var(--ink-3);font-weight:700;">Týden registrace</th>
          <th style="text-align:left;padding:6px 10px;color:var(--ink-3);font-weight:700;">Lidí</th>
          ${windows.map(d => `<th style="text-align:center;padding:6px 10px;color:var(--ink-3);font-weight:700;">D${d}</th>`).join("")}
        </tr></thead>
        <tbody>
          ${cohortWeeks.map(wk => {
            const list = cohorts[wk];
            const dateLabel = new Date(wk).toLocaleDateString("cs-CZ", {day:"numeric", month:"numeric"});
            return `<tr style="border-top:1px solid var(--bg-2);">
              <td style="padding:7px 10px;font-weight:600;">${dateLabel}</td>
              <td style="padding:7px 10px;color:var(--ink-3);">${list.length}</td>
              ${windows.map(d => {
                const pct = pctFor(list, d);
                return `<td style="text-align:center;padding:5px;">
                  ${pct === null
                    ? '<span style="color:var(--ink-3);">—</span>'
                    : `<span style="display:inline-block;min-width:38px;padding:4px 8px;border-radius:6px;background:${cellColor(pct)};color:#fff;font-weight:700;">${pct}%</span>`}
                </td>`;
              }).join("")}
            </tr>`;
          }).join("")}
        </tbody>
      </table>
      </div>
      <div style="margin-top:12px;padding:9px 13px;background:var(--bg-2);border-radius:8px;font-size:11px;color:var(--ink-3);">
        💡 "—" znamená, že ten týden je ještě moc čerstvý na dané okno (např. D30 se dá spočítat až po 30 dnech). Sleduj hlavně, jestli D7 sloupec roste směrem nahoru (novější týdny nahoře) — to je nejrychlejší signál, jestli poslední změny pomáhají.
      </div>
    ` : '<div style="padding:14px;color:var(--ink-3);">Zatím málo dat pro kohortovou analýzu</div>';
  } catch(e) { document.getElementById("admin-cohorts").innerHTML = '<div style="padding:14px;color:var(--ink-3);">Chyba výpočtu: ' + e.message + '</div>'; }

  // ═══════════ SMART: KDY LIDÉ PŘESTÁVAJÍ (churn breakdown) ═══════════
  // "Retence 7d" výše je jedno souhrnné číslo — neříká, JESTLI lidi odcházejí
  // hned první den (problém: onboarding/první dojem) nebo až po pár týdnech
  // (problém: appka se omrzí / chybí důvod se vracet). Tohle je rozlišuje.
  try {
    const now2 = new Date();
    const daysBetween = (a, b) => Math.round((b - a) / 86400000);
    // Jen uživatelé staří aspoň 3 dny — čerství ještě neměli šanci "odejít"
    const matureUsers = users.filter(u => u.userSince && daysBetween(new Date(u.userSince), now2) >= 3);
    const withLastActivity = matureUsers.map(u => {
      const since = new Date(u.userSince);
      const last = u.lastSync ? new Date(u.lastSync) : since;
      const daysActive = Math.max(0, daysBetween(since, last)); // kolik dní PO registraci byl naposled aktivní
      const everActivated = u.nBeds > 0 || u.nHarvest > 0 || u.nDiary > 0;
      return { ...u, daysActive, everActivated };
    });
    const neverStarted = withLastActivity.filter(u => !u.everActivated);
    const started = withLastActivity.filter(u => u.everActivated);
    const buckets = [
      { label: "Jen registrace — nic dalšího", test: u => u.daysActive === 0 },
      { label: "1–2 dny", test: u => u.daysActive >= 1 && u.daysActive <= 2 },
      { label: "3–6 dní", test: u => u.daysActive >= 3 && u.daysActive <= 6 },
      { label: "1–2 týdny", test: u => u.daysActive >= 7 && u.daysActive <= 13 },
      { label: "2–4 týdny", test: u => u.daysActive >= 14 && u.daysActive <= 29 },
      { label: "30+ dní (drží se)", test: u => u.daysActive >= 30 },
    ];
    const counts = buckets.map(b => ({ label: b.label, n: withLastActivity.filter(b.test).length }));
    const maxN = Math.max(1, ...counts.map(c => c.n));
    const total = withLastActivity.length;
    document.getElementById("admin-churn").innerHTML = total ? `
      <div style="display:flex;gap:24px;margin-bottom:18px;flex-wrap:wrap;">
        <div><div style="font-size:24px;font-weight:800;color:${neverStarted.length/total > 0.4 ? 'var(--danger)':'var(--ink)'};">${Math.round(neverStarted.length/total*100)}%</div>
          <div style="font-size:12px;color:var(--ink-3);">se zaregistrovalo, ale nikdy nezaložilo záhon/sklizeň/deník (${neverStarted.length} z ${total})</div></div>
        <div><div style="font-size:24px;font-weight:800;color:var(--ink);">${started.length}</div>
          <div style="font-size:12px;color:var(--ink-3);">skutečně začalo appku používat</div></div>
      </div>
      <div style="font-size:12px;color:var(--ink-3);margin-bottom:10px;">Kolik dní po registraci byla poslední aktivita (všichni zralí uživatelé, ${total} celkem):</div>
      <div style="display:flex;flex-direction:column;gap:9px;">
        ${counts.map(c => `
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:170px;font-size:12.5px;color:var(--ink-2);">${c.label}</div>
            <div style="flex:1;height:16px;background:var(--bg-2);border-radius:6px;overflow:hidden;">
              <div style="height:100%;width:${Math.round(c.n/maxN*100)}%;background:${barGrad(c.label.startsWith('Jen registrace')?'var(--danger)':c.label.startsWith('30+')?'var(--primary)':'var(--warning)')};border-radius:6px;"></div>
            </div>
            <div style="width:80px;text-align:right;font-weight:700;font-size:12.5px;">${c.n} (${total?Math.round(c.n/total*100):0}%)</div>
          </div>
        `).join("")}
      </div>
      <div style="margin-top:14px;padding:10px 14px;background:var(--bg-2);border-radius:8px;font-size:11.5px;color:var(--ink-3);">
        💡 Nejvyšší sloupec ukazuje, kde je hlavní problém. Vysoko u "Jen registrace" = problém je hned na začátku (onboarding, první dojem, appka nedá hodnotu hned). Vysoko u "1–2 dny" nebo "3–6 dní" = lidi to vyzkouší, ale appka je neudrží v prvním týdnu. Nízko u "30+ dní" = appka nedává důvod se vracet dlouhodobě.
      </div>
    ` : '<div style="padding:14px;color:var(--ink-3);">Zatím málo dat (potřeba uživatelé staří aspoň 3 dny)</div>';
  } catch(e) { document.getElementById("admin-churn").innerHTML = '<div style="padding:14px;color:var(--ink-3);">Chyba výpočtu: ' + e.message + '</div>'; }

  // ═══════════ SMART: AKVIZICE — odkud přicházejí noví uživatelé ═══════════
  // Bez tohohle admin nikdy neviděl, které kanály skutečně fungují — appka
  // dřív vůbec nesledovala zdroj registrace (UTM/referrer). Teď je vidět
  // přímo tady, spolu se zbytkem uživatelských dat.
  try {
    const bySource = {};
    users.forEach(u => { const s = u.acqSource || "direct"; bySource[s] = (bySource[s] || 0) + 1; });
    const sortedSources = Object.entries(bySource).sort((a, b) => b[1] - a[1]);
    const totalAcq = users.length;
    const maxAcq = Math.max(1, ...sortedSources.map(s => s[1]));
    // Appka má už zavedený gradient styl pro bary (světlejší → var(--barva)) —
    // sjednocuje se s ním, místo aby zůstala jediná plochá barva.
    const acqColor = (src) => src === "direct" ? "var(--ink-3)" : src.startsWith("referral") ? "var(--info)" : "var(--warning)";
    document.getElementById("admin-acquisition").innerHTML = totalAcq ? `
      <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:6px;">
        ${sortedSources.map(([src, n]) => `
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:200px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${src.replace(/"/g,'&quot;')}">${src}</div>
            <div style="flex:1;height:16px;background:var(--bg-2);border-radius:6px;overflow:hidden;">
              <div style="height:100%;width:${Math.round(n/maxAcq*100)}%;background:${barGrad(acqColor(src))};border-radius:6px;"></div>
            </div>
            <div style="width:90px;text-align:right;font-weight:700;font-size:12.5px;">${n} (${Math.round(n/totalAcq*100)}%)</div>
          </div>
        `).join("")}
      </div>
      <div style="margin-top:10px;padding:9px 13px;background:var(--bg-2);border-radius:8px;font-size:11px;color:var(--ink-3);">
        💡 Chceš tohle sledovat pro konkrétní kampaň? Přidej na odkaz <code>?utm_source=X&utm_medium=Y&utm_campaign=Z</code> — appka si to zapamatuje při první návštěvě.
      </div>
    ` : '<div style="padding:14px;color:var(--ink-3);">Zatím žádná data o zdroji registrace</div>';
  } catch(e) { document.getElementById("admin-acquisition").innerHTML = '<div style="padding:14px;color:var(--ink-3);">Chyba výpočtu: ' + e.message + '</div>'; }

  // ═══════════ SMART: POUŽÍVÁNÍ PRÉMIOVÝCH FUNKCÍ ═══════════
  // Appka dřív vůbec nesledovala, co lidi z placených funkcí skutečně
  // používají — teď se to zaznamenává centrálně (jeden bod v navigaci +
  // pár akcí jako export/QR/hromadné úpravy, které nejsou vlastní stránkou).
  // Počítáno JEN z premium uživatelů — u free by čísla byla zkreslená
  // (nemůžou tyhle funkce vůbec otevřít).
  try {
    const FEATURE_LABELS = {
      mapa: "🗺️ Mapa zahrady", pocasi: "🌤 Chytré počasí", report: "📊 Roční report",
      odrudy: "🌱 Databáze odrůd", lunar: "🌙 Lunární kalendář",
      export: "📤 Export dat", qr: "🏷️ QR štítky", potbulk: "✏️ Hromadné úpravy",
    };
    const premUsers = users.filter(u => u.premium);
    const featureCounts = {};
    Object.keys(FEATURE_LABELS).forEach(k => {
      featureCounts[k] = premUsers.filter(u => (u.featureUsage || {})[k] > 0).length;
    });
    const sortedFeatures = Object.entries(featureCounts).sort((a, b) => b[1] - a[1]);
    const totalPrem = premUsers.length;
    document.getElementById("admin-feature-usage").innerHTML = totalPrem ? `
      <div style="font-size:11.5px;color:var(--ink-3);margin-bottom:12px;">Podíl z ${totalPrem} premium uživatelů, co danou funkci aspoň jednou otevřeli:</div>
      <div style="display:flex;flex-direction:column;gap:9px;">
        ${sortedFeatures.map(([key, n]) => {
          const pct = Math.round(n / totalPrem * 100);
          const color = pct >= 50 ? "var(--primary)" : pct >= 20 ? "var(--warning)" : "var(--danger)";
          return `
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:180px;font-size:12.5px;color:var(--ink-2);">${FEATURE_LABELS[key]}</div>
            <div style="flex:1;height:16px;background:var(--bg-2);border-radius:6px;overflow:hidden;">
              <div style="height:100%;width:${pct}%;background:${barGrad(color)};border-radius:6px;"></div>
            </div>
            <div style="width:90px;text-align:right;font-weight:700;font-size:12.5px;">${n} (${pct}%)</div>
          </div>`;
        }).join("")}
      </div>
      <div style="margin-top:12px;padding:9px 13px;background:var(--bg-2);border-radius:8px;font-size:11px;color:var(--ink-3);">
        💡 Nízké % neznamená nutně, že je funkce špatná — mohla by být jen špatně objevitelná. Než ji měnit, zkus nejdřív zjistit, jestli o ní lidi vůbec vědí.
      </div>
    ` : '<div style="padding:14px;color:var(--ink-3);">Zatím žádní premium uživatelé s daty o používání</div>';
  } catch(e) { document.getElementById("admin-feature-usage").innerHTML = '<div style="padding:14px;color:var(--ink-3);">Chyba výpočtu: ' + e.message + '</div>'; }

  // ═══════════ SMART: ZDRAVÍ DATABÁZE ROSTLIN ═══════════
  try {
    // Nacte se az po kliknuti — setri 1000+ cteni pri kazdem otevreni dashboardu
    const snapH = window._plantHealthSnap || null;
    const docs = snapH ? snapH.docs.map(d => d.data()) : [];
    if (!snapH) {
      const host = document.getElementById("admin-content-health");
      if (host) host.innerHTML = `<div style="text-align:center;padding:14px 16px;">
        <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:10px;line-height:1.5;">
          Kontrola projde všech ${plantCount} druhů v databázi.<br>Spustí se až na vyžádání, aby zbytečně nezatěžovala databázi.</div>
        <button class="btn btn-ghost" onclick="window._loadPlantHealth()">🔍 Zkontrolovat zdraví databáze</button>
      </div>`;
      return;
    }
    const tot = docs.length || 1;
    // Kompletnost klíčových polí
    // Spravne nazvy poli: aplikace i editor ukladaji descriptionCS / careCS.
    // Starsi zaznamy mohou mit desc / care / agro — proto pocitame kterykoliv variant.
    const field = (f) => docs.filter(d => d[f] && String(d[f]).trim()).length;
    const anyField = (...fs) => docs.filter(d => fs.some(f => d[f] && String(d[f]).trim())).length;
    const checks = [
      { label: "Latinský název", n: anyField("nameLat", "lat"), icon: "🔤" },
      { label: "Čeleď", n: anyField("family", "fam", "celed"), icon: "🧬" },
      { label: "Popis", n: anyField("descriptionCS", "description", "desc", "popis"), icon: "📝" },
      { label: "Péče / pěstování", n: anyField("careCS", "care", "agro", "pece"), icon: "🌿" },
      { label: "Zálivka (dny)", n: field("waterDays"), icon: "💧" },
      { label: "Typ rostliny", n: anyField("typ", "type"), icon: "🏷" },
    ];
    const bar = (label, n, icon) => {
      const pct = Math.round(n / tot * 100);
      const col = pct >= 80 ? "var(--primary)" : pct >= 50 ? "var(--warning)" : "var(--danger)";
      return `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${icon} ${label}</span><span style="font-weight:700;color:${col};">${pct}%</span></div>
        <div style="height:7px;background:var(--bg-2);border-radius:99px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${col};border-radius:99px;"></div></div>
        ${tot - n > 0 ? `<div style="font-size:10.5px;color:var(--ink-3);margin-top:2px;">chybí u ${tot - n} druhů</div>` : ""}
      </div>`;
    };
    const overall = Math.round(checks.reduce((s,c) => s + c.n/tot, 0) / checks.length * 100);
    document.getElementById("admin-content-health").innerHTML =
      `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bg-2);">
        <div style="font-size:30px;font-weight:900;color:${overall>=70?'var(--primary)':overall>=40?'var(--warning)':'var(--danger)'};">${overall}%</div>
        <div><div style="font-size:13px;font-weight:700;">Celková kompletnost dat</div><div style="font-size:11px;color:var(--ink-3);">${tot} druhů v databázi</div></div>
      </div>` +
      checks.map(c => bar(c.label, c.n, c.icon)).join("");
  } catch(e) { document.getElementById("admin-content-health").innerHTML = '<div style="padding:14px;color:var(--ink-3);">DB nedostupná</div>'; }

  // ═══════════ SMART: AKČNÍ PANEL (co řešit dnes) ═══════════
  try {
    const items = [];
    if (healthLatest && healthLatest.allOk === false) {
      const failing = Object.entries(healthLatest.checks || {}).filter(([,c]) => !c.ok).map(([name]) => HEALTH_LABELS[name] || name);
      items.push({ icon: "🩺", text: `Kontrola systému hlásí problém: ${failing.join(", ") || "neznámá služba"}`, page: "dashboard", urgent: true });
    }
    if (reqNew > 0) items.push({ icon: "📬", text: `${reqNew} ${reqNew===1?"nový návrh čeká":"nových návrhů čeká"} na vyřízení`, page: "requests", urgent: reqNew >= 5 });
    if (repNew > 0) items.push({ icon: "🚩", text: `${repNew} ${repNew===1?"nahlášený obsah":"nahlášených příspěvků"} ke kontrole`, page: "reports", urgent: true });
    // Neodpovězená témata ve fóru (24h+)
    if (forum) {
      const unanswered = forum.docs.filter(d => {
        const data = d.data();
        const noReplies = (data.replies || []).length === 0;
        const old = data.createdAt && (Date.now() - new Date(data.createdAt)) > 24*3600000;
        return noReplies && old;
      }).length;
      if (unanswered > 0) items.push({ icon: "💬", text: `${unanswered} ${unanswered===1?"téma bez odpovědi":"témat bez odpovědi"} déle než den`, page: "forum", urgent: false });
    }
    // Premium expirující do 7 dní
    const expSoon = users.filter(u => {
      if (!u.premium || !u.premiumInfo?.until) return false;
      const days = (new Date(u.premiumInfo.until) - Date.now()) / 86400000;
      return days > 0 && days <= 7;
    }).length;
    if (expSoon > 0) items.push({ icon: "💎", text: `${expSoon} premium ${expSoon===1?"předplatné vyprší":"předplatných vyprší"} do 7 dní`, page: "premium", urgent: false });
    // Anomálie: prudký pokles aktivity (porovnání tento týden vs minulý)
    const actVals = Object.values(activity);
    const lastWeek = actVals.slice(0, 7).reduce((s,n)=>s+n,0);
    const thisWeek = actVals.slice(7).reduce((s,n)=>s+n,0);
    if (lastWeek > 5 && thisWeek < lastWeek * 0.5) {
      items.push({ icon: "📉", text: `Aktivita klesla o ${Math.round((1-thisWeek/lastWeek)*100)}% oproti minulému týdnu`, page: "dashboard", urgent: true });
    }

    const panel = document.getElementById("admin-action-panel");
    if (!items.length) {
      panel.innerHTML = `<div class="admin-allclear">✅ <strong>Vše vyřízeno</strong> — žádné akce nečekají. Dobrá práce!</div>`;
    } else {
      items.sort((a,b) => (b.urgent?1:0) - (a.urgent?1:0));
      panel.innerHTML = `<div class="admin-action-card">
        <div class="admin-action-head">🎯 Co řešit dnes (${items.length})</div>
        ${items.map(it => `<div class="admin-action-item ${it.urgent?'urgent':''}" onclick="window._pages['${it.page}'] && document.querySelector('[data-page=${it.page}]')?.click()">
          <span class="aai-icon">${it.icon}</span>
          <span class="aai-text">${it.text}</span>
          <span class="aai-go">${it.page!=='dashboard'?'vyřešit →':''}</span>
        </div>`).join("")}
      </div>`;
    }
  } catch(e) {}
});

function timeAgo(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const s = Math.floor((Date.now() - d) / 1000);
  if (s < 60) return "před chvílí";
  if (s < 3600) return `před ${Math.floor(s/60)} min`;
  if (s < 86400) return `před ${Math.floor(s/3600)} h`;
  return `před ${Math.floor(s/86400)} dny`;
}

// ═══════════ STAV SYSTÉMU (hodinová kontrola Firestore/Stripe/AI/e-mail/Functions/web) ═══════════
// Výsledek zapisuje Cloud Function systemHealthHourly do system_health/latest
// (viz gardeeno-functions/functions/index.js) — appka ho jen čte a nabízí
// tlačítko pro ruční spuštění stejné kontroly (systemHealthRunNow). Kontroly
// mají na backendu 2 pokusy s pauzou (withRetry), ať jeden náhodný timeout na
// třetí straně nevygeneruje poplašný e-mail o "výpadku", co za hodinu zmizí.
const HEALTH_LABELS = { firestore: "Databáze (Firestore)", stripe: "Platby (Stripe)", ai: "AI poradce (Gemini)", email: "E-mail (Resend)", functions: "Cloud Functions", web: "Veřejný web" };
const HEALTH_RUN_ENDPOINT = "https://europe-west1-zahrada-43456.cloudfunctions.net/systemHealthRunNow";
// Kolik hodin stará "Poslední kontrola" znamená "hodinová kontrola asi sama
// přestala běžet" (scheduler smazaný, kvóta, …) — na to by "checks: vše OK"
// z dávno posledního běhu neupozornilo, appka by jen tiše ukazovala stará
// zelená data. Hodinový interval + rezerva na jeden vynechaný běh = 2,5 h.
const HEALTH_STALE_HOURS = 2.5;

// data: "loading" (fetch teprve běží) | null (fetch doběhl, ale system_health/latest
// ještě neexistuje — typicky hned po nasazení, než poprvé proběhne hodinová kontrola)
// | {checks, allOk, checkedAt} (skutečná data). Tyhle dva prázdné stavy vypadaly
// dřív identicky ("⏳ Načítám…" navždy, bez tlačítka) — proto se karta jevila
// jako "zaseklá", i když fetch dávno doběhl a jen čestně hlásil "nic tu není".
function renderSystemHealth(data) {
  const el = document.getElementById("admin-health");
  if (!el) return;
  if (data === "loading") {
    el.innerHTML = `<div class="card-h"><div class="card-title">🩺 Stav systému</div></div>
      <div style="padding:14px;color:var(--ink-3);">⏳ Načítám…</div>`;
    return;
  }
  if (!data) {
    el.innerHTML = `
      <div class="card-h" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div class="card-title">🩺 Stav systému</div>
        <button class="btn btn-ghost" id="health-run-btn" onclick="window._healthRunNow()">🔄 Zkontrolovat teď</button>
      </div>
      <div style="padding:14px;color:var(--ink-3);">Zatím žádná data — hodinová kontrola ještě neproběhla (buď po nasazení ještě neuplynula hodina, nebo funkce systemHealthHourly není nasazená). Klikni na "Zkontrolovat teď" pro okamžitou kontrolu.</div>`;
    return;
  }
  const checks = data.checks || {};
  const names = Object.keys(HEALTH_LABELS).filter(k => k in checks);
  const allOk = data.allOk !== false;
  const rows = names.map(k => {
    const c = checks[k] || {};
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg-2);">
      <span style="font-size:16px;">${c.ok ? "✅" : "🔴"}</span>
      <span style="flex:1;font-size:13px;font-weight:600;">${HEALTH_LABELS[k]}</span>
      ${!c.ok ? `<span style="font-size:11.5px;color:var(--danger);max-width:320px;text-align:right;">${esc((c.error||"selhalo").toString().slice(0,140))}</span>` : ""}
    </div>`;
  }).join("");
  // "Kdo hlídá hlídače": pokud systemHealthHourly sama přestala běžet, tenhle
  // dokument by tu jen tiše stárnul se starým (třeba zeleným) výsledkem —
  // nic by na to jinak neupozornilo. Stará data proto ukážeme jako VAROVÁNÍ,
  // i když poslední skutečný běh dopadl OK.
  const ageHours = data.checkedAt ? (Date.now() - new Date(data.checkedAt).getTime()) / 3600000 : Infinity;
  const isStale = ageHours > HEALTH_STALE_HOURS;
  el.innerHTML = `
    <div class="card-h" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div class="card-title">🩺 Stav systému ${allOk ? '<span style="color:var(--primary);font-weight:700;">— vše v pořádku</span>' : '<span style="color:var(--danger);font-weight:700;">— problém</span>'}</div>
      <button class="btn btn-ghost" id="health-run-btn" onclick="window._healthRunNow()">🔄 Zkontrolovat teď</button>
    </div>
    ${isStale ? `<div style="background:var(--warning-soft,#fef3c7);color:#92400e;border-radius:8px;padding:8px 12px;font-size:12px;margin:4px 0 10px;">⚠️ Poslední kontrola je stará ${timeAgo(data.checkedAt)} — hodinová automatická kontrola možná sama přestala běžet (zkontroluj Cloud Scheduler / nasazení systemHealthHourly).</div>` : ""}
    ${rows || '<div style="padding:14px;color:var(--ink-3);">Zatím žádná data — klikni na "Zkontrolovat teď", nebo počkej na hodinovou kontrolu.</div>'}
    <div style="font-size:11px;color:var(--ink-3);margin-top:8px;">Poslední kontrola: ${data.checkedAt ? timeAgo(data.checkedAt) : "nikdy"} · automaticky každou hodinu, e-mail jen při změně stavu</div>
  `;
}

function esc(s) { return String(s == null ? "" : s).replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c])); }

window._healthRunNow = async () => {
  const btn = document.getElementById("health-run-btn");
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Kontroluju…"; }
  try {
    const token = await auth.currentUser.getIdToken();
    const res = await fetch(HEALTH_RUN_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || ("HTTP " + res.status));
    renderSystemHealth(data);
    window.toast(data.allOk !== false ? "Vše v pořádku ✅" : "Nalezen problém — viz karta Stav systému", data.allOk !== false ? "success" : "error");
  } catch (e) {
    window.toast("Kontrola selhala: " + e.message, "error");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "🔄 Zkontrolovat teď"; }
  }
};
</script>


<script type="module">
const { db, collection, getDocs, doc, setDoc, updateDoc, deleteDoc } = window._fb;
let _plants = [];
let _filter = "all";
let _search = "";

window.registerPage("plants", async (root) => {
  root.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">🌿 Plant DB <span style="color:var(--ink-3);font-weight:500;font-size:13px;margin-left:8px;">master databáze</span></div>
        <div class="page-sub">Hlavní databáze rostlin (read by app PLANTS layer) — Firestore kolekce <code style="background:var(--bg-2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:11px;">plant_db</code></div>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost" onclick="window._pages.plants(document.getElementById('main'))">🔄 Aktualizovat</button>
        <button class="btn btn-primary" onclick="openPlantEditor()">+ Nová rostlina</button>
      </div>
    </div>
    <div class="pills" id="plant-filters"></div>
    <div class="tbl-wrap">
      <div class="tbl-head">
        <input type="text" class="tbl-search" placeholder="Hledej (název, latinsky, tagy…)" id="plant-search">
        <div style="font-size:12px;color:var(--ink-3);" id="plant-count">—</div>
      </div>
      <div id="plant-loading" class="tbl-loading">⏳ Načítám plant_db z Firestore…</div>
      <div id="plant-tbl" style="display:none;"></div>
    </div>
  `;

  try {
    const snap = await getDocs(collection(db, "plant_db"));
    _plants = [];
    snap.forEach(d => _plants.push({ id: d.id, ...d.data() }));
    _plants.sort((a, b) => (a.name || "").localeCompare(b.name || "", "cs"));
    window._plantDbCache = _plants; // sdileni pro statistiky (celedi)
    renderPlants();
  } catch(e) {
    document.getElementById("plant-loading").innerHTML = `❌ Chyba: ${e.message}`;
  }

  document.getElementById("plant-search").addEventListener("input", e => { _search = e.target.value; renderPlants(); });
});

function renderPlants() {
  // Filters dle typu
  const types = {}; _plants.forEach(p => { const t = p.typ || "?"; types[t] = (types[t]||0)+1; });
  const sortedTypes = Object.entries(types).sort((a,b) => b[1]-a[1]);
  document.getElementById("plant-filters").innerHTML = `
    <button class="pill ${_filter==="all"?"active":""}" onclick="window._plantFilter('all')">Vše (${_plants.length})</button>
    ${sortedTypes.map(([t,n]) => `<button class="pill ${_filter===t?"active":""}" onclick="window._plantFilter('${t}')">${t} (${n})</button>`).join("")}
  `;

  let list = _plants;
  if (_filter !== "all") list = list.filter(p => p.typ === _filter);
  if (_search) {
    const q = _search.toLowerCase();
    list = list.filter(p => (p.name||"").toLowerCase().includes(q) || (p.nameLat||"").toLowerCase().includes(q) || (p.tags||[]).some(t => t.toLowerCase().includes(q)));
  }

  document.getElementById("plant-count").textContent = `${list.length} z ${_plants.length}`;
  document.getElementById("plant-loading").style.display = "none";
  document.getElementById("plant-tbl").style.display = "";

  document.getElementById("plant-tbl").innerHTML = list.length ? `
    <table>
      <thead><tr><th>Název</th><th>Lat.</th><th>Typ</th><th>Čeleď</th><th>Tagy</th><th style="text-align:right;">Akce</th></tr></thead>
      <tbody>
        ${list.slice(0, 200).map(p => `
          <tr>
            <td><strong>${(p.name||"").replace(/</g,"&lt;")}</strong></td>
            <td style="color:var(--ink-3);font-style:italic;font-size:12px;">${(p.nameLat||"")}</td>
            <td><span class="chip chip-${typeColorPlant(p.typ)}">${p.typ || "?"}</span></td>
            <td style="color:var(--ink-3);font-size:12px;">${(p.family||"")}</td>
            <td style="color:var(--ink-3);font-size:12px;">${(p.tags||[]).slice(0,3).join(", ")}</td>
            <td style="text-align:right;">
              <button class="btn btn-ghost" style="padding:4px 10px;min-height:28px;font-size:12px;" onclick="window._editPlant('${p.id}')">Upravit</button>
              <button class="btn btn-ghost" style="padding:4px 10px;min-height:28px;font-size:12px;color:var(--danger);" onclick="window._delPlant('${p.id}','${(p.name||"").replace(/'/g,"&#39;")}')">🗑</button>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
    ${list.length > 200 ? `<div class="tbl-foot">Zobrazeno 200 z ${list.length} — upřesni filtr nebo hledání</div>` : `<div class="tbl-foot">${list.length} záznamů</div>`}
  ` : '<div class="tbl-empty">Žádné výsledky</div>';
}

function typeColorPlant(t) {
  return ({zelenina:"primary",ovoce:"warn",bylinka:"info",pokojovka:"violet",kaktus:"warn",sukulentni:"warn",strom:"primary",ker:"primary",trvalka:"violet"}[t]) || "muted";
}

window._plantFilter = (f) => { _filter = f; renderPlants(); };
window._editPlant = (id) => openPlantEditor(_plants.find(p => p.id === id));
window._delPlant = async (id, name) => {
  if (!confirm(`Smazat "${name}"?`)) return;
  try {
    await deleteDoc(doc(db, "plant_db", id));
    _plants = _plants.filter(p => p.id !== id);
    renderPlants();
    window.toast(`Smazáno: ${name}`, "success");
  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};

function openPlantEditor(p) {
  const isNew = !p;
  p = p || { name:"", nameLat:"", typ:"zelenina", family:"", descriptionCS:"", careCS:"", tags:[], waterDays:7, fertilizeDays:21, difficulty:"easy", light:"bright_indirect" };
  window.openModal(
    isNew ? "Nová rostlina" : `Úprava: ${p.name}`,
    `<div class="field"><div class="field-label">Název CS *</div><input class="field-input" id="pe-name" value="${(p.name||"").replace(/"/g,"&quot;")}"></div>
    <div class="field"><div class="field-label">Latinsky</div><input class="field-input" id="pe-lat" value="${(p.nameLat||"").replace(/"/g,"&quot;")}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field"><div class="field-label">Typ *</div>
        <select class="field-input" id="pe-typ">
          ${["zelenina","ovoce","bylinka","pokojovka","kaktus","sukulentni","strom","ker","trvalka","letnicka","cibuloviny","popinavy","trava","kapradina"].map(t => `<option value="${t}" ${p.typ===t?"selected":""}>${t}</option>`).join("")}
        </select>
      </div>
      <div class="field"><div class="field-label">Čeleď</div><input class="field-input" id="pe-fam" value="${(p.family||"").replace(/"/g,"&quot;")}"></div>
    </div>
    <div class="field"><div class="field-label">Popis</div><textarea class="field-input" id="pe-desc">${p.descriptionCS||""}</textarea></div>
    <div class="field"><div class="field-label">Péče</div><textarea class="field-input" id="pe-care">${p.careCS||""}</textarea></div>
    <div class="field"><div class="field-label">Tagy (čárkou)</div><input class="field-input" id="pe-tags" value="${(p.tags||[]).join(", ")}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      <div class="field"><div class="field-label">Zálivka (dny)</div><input class="field-input" id="pe-water" type="number" value="${p.waterDays||7}"></div>
      <div class="field"><div class="field-label">Hnojení (dny)</div><input class="field-input" id="pe-fert" type="number" value="${p.fertilizeDays||21}"></div>
      <div class="field"><div class="field-label">Obtížnost</div>
        <select class="field-input" id="pe-diff">
          <option value="easy" ${p.difficulty==="easy"?"selected":""}>Snadná</option>
          <option value="medium" ${p.difficulty==="medium"?"selected":""}>Střední</option>
          <option value="hard" ${p.difficulty==="hard"?"selected":""}>Náročná</option>
        </select>
      </div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Zrušit</button>
    <button class="btn btn-primary" onclick="window._savePlant('${p.id||""}', ${isNew})">Uložit</button>`
  );
}
window._openPlantEditor = openPlantEditor;

window._savePlant = async (id, isNew) => {
  const data = {
    name: document.getElementById("pe-name").value.trim(),
    nameLat: document.getElementById("pe-lat").value.trim(),
    typ: document.getElementById("pe-typ").value,
    family: document.getElementById("pe-fam").value.trim(),
    descriptionCS: document.getElementById("pe-desc").value.trim(),
    careCS: document.getElementById("pe-care").value.trim(),
    tags: document.getElementById("pe-tags").value.split(",").map(t => t.trim()).filter(Boolean),
    waterDays: parseInt(document.getElementById("pe-water").value) || 7,
    fertilizeDays: parseInt(document.getElementById("pe-fert").value) || 21,
    difficulty: document.getElementById("pe-diff").value,
    updatedAt: new Date().toISOString()
  };
  if (!data.name) { window.toast("Název je povinný", "error"); return; }
  try {
    if (isNew) {
      const newId = data.name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") + "_" + Date.now().toString(36);
      await setDoc(doc(db, "plant_db", newId), data);
      _plants.push({ id: newId, ...data });
    } else {
      await setDoc(doc(db, "plant_db", id), data, { merge: true });
      const idx = _plants.findIndex(p => p.id === id);
      if (idx >= 0) _plants[idx] = { id, ..._plants[idx], ...data };
    }
    _plants.sort((a,b) => (a.name||"").localeCompare(b.name||"","cs"));
    renderPlants();
    closeModal();
    window.toast(isNew ? "Rostlina přidána" : "Uloženo", "success");
  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};
window.openPlantEditor = openPlantEditor;
</script>


<script type="module">
const { db, collection, getDocs, doc, deleteDoc, updateDoc, query, orderBy, limit } = window._fb;
let _threads = [];
let _filter = "all";
// Lokální kopie — timeAgo() z dashboard bloku (jiný <script type="module">)
// tady NENÍ vidět, moduly si scope nesdílí. Bez tohohle renderForum() spadne
// na "timeAgo is not defined" hned na PRVNÍM vlákně, co se snaží vykreslit
// (pilulky/počet nad tím se stihnou vykreslit dřív, než k pádu dojde — proto
// šlo vidět počet, ale ne tabulku). Chybu navíc předtím appka schovala do
// #forum-loading, které je v tu chvíli už display:none — viz oprava níže.
function timeAgo(iso) {
  if (!iso) return "—";
  const d = new Date(iso); const s = Math.floor((Date.now()-d)/1000);
  if (s < 60) return "před chvílí";
  if (s < 3600) return `před ${Math.floor(s/60)} min`;
  if (s < 86400) return `před ${Math.floor(s/3600)} h`;
  return `před ${Math.floor(s/86400)} dny`;
}

window.registerPage("forum", async (root) => {
  root.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">💬 Fórum — moderace</div>
        <div class="page-sub">Témata, odpovědi a zásahy v komunitě</div>
      </div>
      <button class="btn btn-ghost" onclick="window._pages.forum(document.getElementById('main'))">🔄 Aktualizovat</button>
    </div>
    <div class="pills" id="forum-pills"></div>
    <div class="tbl-wrap">
      <div class="tbl-head">
        <input type="text" class="tbl-search" placeholder="Hledej v titulcích…" id="forum-search">
        <div style="font-size:12px;color:var(--ink-3);" id="forum-count">—</div>
      </div>
      <div id="forum-loading" class="tbl-loading">⏳ Načítám fórum…</div>
      <div id="forum-tbl" style="display:none;"></div>
    </div>
  `;
  try {
    const snap = await getDocs(query(collection(db, "forum_posts"), orderBy("createdAt", "desc"), limit(500)));
    _threads = [];
    snap.forEach(d => _threads.push({ id: d.id, ...d.data() }));
    renderForum();
  } catch(e) {
    // POZOR: renderForum() sama VŽDY schová #forum-loading (display:none)
    // hned na začátku, ještě před tím, než by případně spadla na vykreslení
    // tabulky (viz timeAgo oprava výš) — takže psát chybu SEM by ji znovu
    // schovalo do neviditelného elementu. #forum-tbl je v tu chvíli už
    // odkryté, i když prázdné, takže error tam skutečně uvidíš.
    document.getElementById("forum-loading").style.display = "none";
    document.getElementById("forum-tbl").style.display = "";
    document.getElementById("forum-tbl").innerHTML = `<div class="tbl-empty" style="color:var(--danger);">❌ ${(e.message||"").replace(/</g,"&lt;")}</div>`;
  }
  document.getElementById("forum-search").addEventListener("input", e => { window._forumSearch = e.target.value; renderForum(); });
});

function renderForum() {
  const cats = {}; _threads.forEach(t => { const c = t.category || "?"; cats[c] = (cats[c]||0)+1; });
  document.getElementById("forum-pills").innerHTML = `
    <button class="pill ${_filter==="all"?"active":""}" onclick="window._forumFilter('all')">Vše (${_threads.length})</button>
    ${Object.entries(cats).sort((a,b) => b[1]-a[1]).map(([c,n]) => `<button class="pill ${_filter===c?"active":""}" onclick="window._forumFilter('${c}')">${c} (${n})</button>`).join("")}
  `;
  let list = _filter === "all" ? _threads : _threads.filter(t => t.category === _filter);
  const q = (window._forumSearch || "").toLowerCase();
  if (q) list = list.filter(t => (t.title||"").toLowerCase().includes(q) || (t.body||"").toLowerCase().includes(q));
  document.getElementById("forum-count").textContent = `${list.length} z ${_threads.length}`;
  document.getElementById("forum-loading").style.display = "none";
  document.getElementById("forum-tbl").style.display = "";
  document.getElementById("forum-tbl").innerHTML = list.length ? `
    <table>
      <thead><tr><th>Téma</th><th>Autor</th><th>Kategorie</th><th>Odpov.</th><th>Vytvořeno</th><th style="text-align:right;">Akce</th></tr></thead>
      <tbody>
        ${list.slice(0,150).map(t => `
          <tr>
            <td><strong onclick="window._openThread('${t.id}')" style="cursor:pointer;">${(t.title||"").replace(/</g,"&lt;").slice(0,80)}</strong></td>
            <td style="color:var(--ink-2);font-size:12px;">${(t.authorName||"?").replace(/</g,"&lt;")}</td>
            <td><span class="chip chip-muted">${t.category||"?"}</span></td>
            <td>${(t.replies||[]).length}</td>
            <td style="color:var(--ink-3);font-size:12px;">${timeAgo(t.createdAt)}</td>
            <td style="text-align:right;">
              <button class="btn btn-ghost" style="padding:4px 10px;min-height:28px;font-size:12px;" onclick="window._openThread('${t.id}')">Otevřít</button>
              <button class="btn btn-ghost" style="padding:4px 10px;min-height:28px;font-size:12px;color:var(--danger);" onclick="window._delThread('${t.id}','${(t.title||"").replace(/'/g,"&#39;")}')">🗑</button>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
    <div class="tbl-foot">${list.length} témat${list.length > 150 ? " (zobrazeno 150)" : ""}</div>
  ` : '<div class="tbl-empty">Žádná témata</div>';
}

function timeAgo_unused_duplicate(iso) {
  if (!iso) return "—";
  const d = new Date(iso); const s = Math.floor((Date.now()-d)/1000);
  if (s < 60) return "před chvílí";
  if (s < 3600) return `před ${Math.floor(s/60)} min`;
  if (s < 86400) return `před ${Math.floor(s/3600)} h`;
  return `před ${Math.floor(s/86400)} dny`;
}

window._forumFilter = (f) => { _filter = f; renderForum(); };
window._delThread = async (id, title) => {
  if (!confirm(`Smazat téma "${title}"?`)) return;
  try {
    await deleteDoc(doc(db, "forum_posts", id));
    _threads = _threads.filter(t => t.id !== id);
    renderForum();
    window.toast("Téma smazáno", "success");
  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};

window._openThread = (id) => {
  const t = _threads.find(x => x.id === id);
  if (!t) return;
  const replies = (t.replies || []);
  window.openModal(
    `💬 ${t.title}`,
    `<div style="font-size:13px;line-height:1.6;color:var(--ink-2);margin-bottom:14px;padding:12px;background:var(--bg-2);border-radius:8px;">${(t.body||"").replace(/</g,"&lt;").replace(/\n/g,"<br>")}</div>
    <div style="font-size:11px;color:var(--ink-3);margin-bottom:14px;">Od <strong>${t.authorName||"?"}</strong> · ${t.category} · ${timeAgo(t.createdAt)}</div>
    <div class="sect-title">Odpovědi (${replies.length})</div>
    <div style="display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;">
      ${replies.map((r, i) => `
        <div style="background:var(--bg-2);border-radius:8px;padding:10px 12px;">
          <div style="font-size:11px;color:var(--ink-3);margin-bottom:4px;"><strong>${(r.authorName||"?").replace(/</g,"&lt;")}</strong> · ${timeAgo(r.createdAt)}</div>
          <div style="font-size:13px;">${(r.body||"").replace(/</g,"&lt;").replace(/\n/g,"<br>")}</div>
          <button class="btn btn-ghost" style="margin-top:6px;font-size:11px;padding:3px 8px;min-height:24px;color:var(--danger);" onclick="window._delReply('${t.id}',${i})">🗑 Smazat odpověď</button>
        </div>
      `).join("") || '<div style="color:var(--ink-3);font-size:12px;">Zatím žádné odpovědi</div>'}
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Zavřít</button>
     <button class="btn btn-danger" onclick="window._delThread('${t.id}','${(t.title||"").replace(/'/g,"&#39;")}');closeModal()">🗑 Smazat téma</button>`
  );
};

window._delReply = async (threadId, replyIdx) => {
  if (!confirm("Smazat tuto odpověď?")) return;
  const t = _threads.find(x => x.id === threadId);
  if (!t) return;
  const newReplies = (t.replies || []).filter((_, i) => i !== replyIdx);
  try {
    await updateDoc(doc(db, "forum_posts", threadId), { replies: newReplies });
    t.replies = newReplies;
    window._openThread(threadId);
    window.toast("Odpověď smazána", "success");
  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};
</script>


<script type="module">
const { db, collection, getDocs, doc, deleteDoc, updateDoc, query, orderBy, limit, auth, setDoc } = window._fb;
let _reqs = [];
let _filter = "all";

window.registerPage("requests", async (root) => {
  root.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">📬 Návrhy uživatelů</div>
        <div class="page-sub">Co lidé žádají přidat do databáze. „Z vyhledávání" = hledali to v appce a nic nenašli.</div>
      </div>
      <button class="btn btn-ghost" onclick="window._pages.requests(document.getElementById('main'))">🔄 Aktualizovat</button>
    </div>
    <div class="pills" id="req-pills"></div>
    <div class="tbl-wrap">
      <div id="req-loading" class="tbl-loading">⏳ Načítám…</div>
      <div id="req-content" style="display:none;"></div>
    </div>
  `;
  try {
    const snap = await getDocs(query(collection(db, "missing_requests"), orderBy("createdAt", "desc"), limit(500)));
    _reqs = [];
    snap.forEach(d => _reqs.push({ id: d.id, ...d.data() }));
    renderReqs();
  } catch(e) { document.getElementById("req-loading").innerHTML = `❌ ${e.message}`; }
});

function renderReqs() {
  const types = {}; _reqs.forEach(r => { types[r.type] = (types[r.type]||0)+1; });
  const newCount = _reqs.filter(r => (r.status||"new") === "new").length;
  document.getElementById("req-pills").innerHTML = `
    <button class="pill ${_filter==="all"?"active":""}" onclick="window._reqFilter('all')">Vše (${_reqs.length})</button>
    <button class="pill ${_filter==="new"?"active":""}" onclick="window._reqFilter('new')" style="margin-left:auto;">⏳ Nevyřízené (${newCount})</button>
    ${Object.entries(types).sort((a,b) => b[1]-a[1]).map(([t,n]) => `<button class="pill ${_filter===t?"active":""}" onclick="window._reqFilter('${t}')">${typeLabel(t)} (${n})</button>`).join("")}
  `;
  let list = _reqs;
  if (_filter === "new") list = list.filter(r => (r.status||"new") === "new");
  else if (_filter !== "all") list = list.filter(r => r.type === _filter);

  document.getElementById("req-loading").style.display = "none";
  document.getElementById("req-content").style.display = "";
  document.getElementById("req-content").innerHTML = list.length ? `
    <table>
      <thead><tr><th>Typ</th><th>Návrh</th><th>Od koho</th><th>Stav</th><th>Datum</th><th style="text-align:right;">Akce</th></tr></thead>
      <tbody>
        ${list.map(r => `
          <tr>
            <td><span class="chip chip-${typeColor(r.type)}">${typeLabel(r.type)}</span></td>
            <td style="max-width:440px;">
              <strong style="word-break:break-word;">${(r.text||"—").replace(/</g,"&lt;")}</strong>
              ${(r.query && r.query !== r.text) ? `<div style="font-size:11.5px;color:var(--ink-2);margin-top:4px;background:var(--bg-2);border-radius:6px;padding:3px 8px;display:inline-block;">🔍 hledal: <strong>${String(r.query).replace(/</g,"&lt;")}</strong></div>` : ""}
              ${r.type==="obecne" && !r.query ? '<div style="font-size:11px;color:var(--ink-3);margin-top:3px;">z vyhledávání v aplikaci</div>' : ""}
            </td>
            <td style="color:var(--ink-2);font-size:12px;">
              ${(r.userName||"anonymní").replace(/</g,"&lt;")}
              ${r.userEmail && r.userEmail !== r.userName ? `<div style="font-size:11px;color:var(--ink-3);">${String(r.userEmail).replace(/</g,"&lt;")}</div>` : ""}
            </td>
            <td>${statusChipReq(r.status)}</td>
            <td style="color:var(--ink-3);font-size:12px;">${new Date(r.createdAt).toLocaleDateString("cs-CZ")}</td>
            <td style="text-align:right;display:flex;gap:4px;justify-content:flex-end;">
              ${(r.status||"new") !== "done" ? `<button class="btn btn-soft" style="padding:4px 10px;min-height:28px;font-size:12px;" onclick="window._markReq('${r.id}','done')">✓</button>`:""}
              ${r.status !== "done" && (r.type === "plodina" || r.type === "pokojovka" || r.type === "rostlina" || r.type === "kvetinac_rostlina" || r.type === "obecne") ? `<button class="btn btn-ghost btn-sm" title="AI vytvoří rostlinu a uloží ji do databáze" onclick="window._aiCreatePlant('${r.id}')" style="color:var(--primary);">✨ Vytvořit</button>`:""}
              ${(r.status||"new") !== "rejected" ? `<button class="btn btn-ghost" style="padding:4px 10px;min-height:28px;font-size:12px;" onclick="window._markReq('${r.id}','rejected')">✕</button>`:""}
              <button class="btn btn-ghost" style="padding:4px 10px;min-height:28px;font-size:12px;color:var(--danger);" onclick="window._delReq('${r.id}')">🗑</button>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>
    <div class="tbl-foot">${list.length} návrhů</div>
  ` : '<div class="tbl-empty">Žádné návrhy</div>';
}

function typeLabel(t) { return ({plodina:"🌱 Plodina",pokojovka:"🪴 Pokojovka",kvetinac_rostlina:"🪻 Květináč",skudce:"🦟 Škůdce",recept:"🍳 Recept",rostlina:"🌿 Rostlina",obecne:"🔍 Z vyhledávání"}[t]) || t; }
function typeColor(t) { return ({plodina:"primary",pokojovka:"violet",kvetinac_rostlina:"info",skudce:"warn",recept:"danger"}[t]) || "muted"; }
function statusChipReq(s) {
  s = s || "new";
  if (s === "done") return '<span class="chip chip-primary">✓ Hotovo</span>';
  if (s === "rejected") return '<span class="chip chip-muted">Zamítnuto</span>';
  return '<span class="chip chip-warn">⏳ Nové</span>';
}

window._reqFilter = (f) => { _filter = f; renderReqs(); };
window._markReq = async (id, status) => {
  try {
    await updateDoc(doc(db, "missing_requests", id), { status, reviewedAt: new Date().toISOString() });
    const r = _reqs.find(x => x.id === id); if (r) r.status = status;
    renderReqs(); window.toast("Aktualizováno", "success"); window._loadBadges?.();
  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};
// AI vygeneruje rostlinu, admin ji zkontroluje a teprve pak ulozi.
// Dvoukrokove: nejdriv nahled (nic se neuklada), pak potvrzeni.
async function _enrichCall(nazev, preview) {
  const u = window._fb.auth.currentUser;
  if (!u) throw new Error("Nejsi přihlášen");
  const tok = await u.getIdToken();
  const res = await fetch("https://europe-west1-zahrada-43456.cloudfunctions.net/enrichPlant", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tok },
    body: JSON.stringify({ name: nazev, nameLat: "", preview: !!preview })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 422) throw new Error(data.message || "AI to nerozpoznala jako rostlinu");
    if (res.status === 429) throw new Error("Denní limit vyčerpán, zkus to zítra");
    if (res.status === 403) throw new Error("Nemáš oprávnění (funkce je pro Ultra)");
    throw new Error(data.message || data.error || ("Chyba " + res.status));
  }
  return data;
}

function _plantPreviewHtml(p) {
  const esc = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const radek = (label, val) => val
    ? `<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);">
         <div style="width:130px;flex:0 0 auto;font-size:12px;color:var(--ink-3);">${label}</div>
         <div style="flex:1;font-size:13px;color:var(--ink);">${esc(val)}</div></div>`
    : "";
  return `
    <div style="max-height:56vh;overflow-y:auto;">
      <div style="background:var(--bg-2);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;color:var(--ink-2);line-height:1.55;">
        🔍 Zkontroluj údaje. Do databáze se uloží až po kliknutí na <strong>Uložit do databáze</strong>.
      </div>
      ${radek("Název", p.name)}
      ${radek("Latinsky", p.nameLat)}
      ${radek("Typ", p.typ)}
      ${radek("Čeleď", p.family)}
      ${radek("Zálivka", p.waterDays ? `po ${p.waterDays} dnech` : "")}
      ${radek("Hnojení", p.fertilizeDays ? `po ${p.fertilizeDays} dnech` : "")}
      ${radek("Světlo", p.light)}
      ${radek("Vlhkost", p.humid || p.humidity)}
      ${radek("Náročnost", p.difficulty)}
      ${radek("Jedovatost", p.toxicity === "toxic" ? "⚠️ jedovatá" : "bezpečná")}
      ${radek("Štítky", (p.tags || []).join(", "))}
      <div style="margin-top:12px;">
        <div style="font-size:12px;color:var(--ink-3);margin-bottom:4px;">Popis</div>
        <div style="font-size:13px;line-height:1.6;color:var(--ink);background:var(--bg-2);border-radius:8px;padding:10px 12px;">${esc(p.descriptionCS) || "—"}</div>
      </div>
      <div style="margin-top:10px;">
        <div style="font-size:12px;color:var(--ink-3);margin-bottom:4px;">Péče</div>
        <div style="font-size:13px;line-height:1.6;color:var(--ink);background:var(--bg-2);border-radius:8px;padding:10px 12px;">${esc(p.careCS) || "—"}</div>
      </div>
    </div>`;
}

window._aiCreatePlant = async (id) => {
  const r = _reqs.find(x => x.id === id);
  if (!r) return;
  const nazev = (r.text || "").trim();
  if (!nazev) { window.toast("Návrh nemá název rostliny", "warn"); return; }

  window.openModal(`✨ ${nazev}`,
    '<div style="text-align:center;padding:34px 20px;color:var(--ink-3);">⏳ AI generuje rostlinu…</div>', "");
  try {
    const data = await _enrichCall(nazev, true);   // nahled
    window._pendingPlant = { req: id, plant: data.plant, plantId: data.id };
    window.openModal(
      `✨ ${data.plant.name || nazev}`,
      _plantPreviewHtml(data.plant),
      `<button class="btn btn-ghost" onclick="closeModal()">Zrušit</button>
       <button class="btn btn-ghost" onclick="window._aiCreatePlant('${id}')">↻ Zkusit znovu</button>
       <button class="btn btn-primary" onclick="window._savePendingPlant()">✓ Uložit do databáze</button>`
    );
  } catch (e) {
    window.openModal("Nepodařilo se vytvořit",

};

// Ulozi rostlinu z nahledu do databaze a oznaci navrh jako vyrizeny
window._savePendingPlant = async () => {
  const p = window._pendingPlant;
  if (!p) return;
  try {
    await setDoc(doc(db, "plant_db", p.plantId), p.plant, { merge: true });
    // Zvednout verzi databaze — aplikace tak pozna, ze ma nacist cerstva data
    try { await setDoc(doc(db, "databases", "plant_db_meta"), { version: String(Date.now()) }, { merge: true }); } catch (e) {}
    await updateDoc(doc(db, "missing_requests", p.req), {
      status: "done", reviewedAt: new Date().toISOString(), createdPlantId: p.plantId
    });
    const r = _reqs.find(x => x.id === p.req); if (r) r.status = "done";
    window._pendingPlant = null;
    window._plantHealthSnap = null;   // zdravi DB se prepocita
    closeModal();
    renderReqs();
    window._loadBadges?.();
    window.toast(`✓ „${p.plant.name}" uložena do databáze`, "success");
  } catch (e) {
    window.toast("Uložení selhalo: " + e.message, "error");
  }
};

window._delReq = async (id) => {
  if (!confirm("Smazat návrh?")) return;
  try {
    await deleteDoc(doc(db, "missing_requests", id));
    _reqs = _reqs.filter(r => r.id !== id);
    renderReqs(); window.toast("Smazáno", "success");
  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};
</script>

};

  try {
    await updateDoc(doc(db, "komunitniTrh", id), { foto: null, fotoStatus: "zamítnuto" });

      try { await deleteObject(storageRef(window._fb.storage, decodeURIComponent(new URL(fotoUrl).pathname.split("/o/")[1].split("?")[0]))); }

};

  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};
</script>

        <div class="card-h"><div class="card-title">🌾 Nejčastější čeledi</div></div>
