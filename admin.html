  // Drive se cetlo primo z dokumentu (u.beds, u.harvest...) → vsechny statistiky byly nulove.
  try {
    const snap = await getDocs(query(collection(db, "users"), limit(1000)));
    const users = [];
    snap.forEach(d => {
      const raw = d.data();
      let st = raw;
      if (typeof raw.data === "string") { try { st = JSON.parse(raw.data); } catch(e) { st = {}; } }
      users.push({
        id: d.id,
        email: raw.email || "",
        premium: raw.premium === true || (raw.premium === undefined && !!st.premium),
        premiumInfo: raw.premiumInfo || st.premiumInfo || {},
        updatedAt: raw.updatedAt || "",
        userSince: st.userSince || raw.createdAt || "",
        st: st || {}
      });
    });

    const now = Date.now();
    const daysAgo = (iso) => { if (!iso) return 99999; const t = new Date(iso).getTime(); return isNaN(t) ? 99999 : (now - t) / 86400000; };
    const sum = (fn) => users.reduce((s,u) => s + (fn(u) || 0), 0);
    const arr = (u, k) => Array.isArray(u.st[k]) ? u.st[k] : [];

    const totalUsers = users.length;
    // uroven predplatneho u kazdeho uzivatele
    const _tier = (u) => {
      const pi = u.premiumInfo || {};
      if (!(u.premium || pi.active)) return "free";
      return pi.tier === "ultra" ? "ultra" : "premium";
    };
    const premiumOnly = users.filter(u => _tier(u) === "premium").length;
    const ultraUsers  = users.filter(u => _tier(u) === "ultra").length;
    const premiumUsers = premiumOnly + ultraUsers;
    const convRate = totalUsers ? (premiumUsers / totalUsers * 100) : 0;
    const ultraShare = premiumUsers ? (ultraUsers / premiumUsers * 100) : 0;
    const active7 = users.filter(u => daysAgo(u.updatedAt) <= 7).length;
    const active30 = users.filter(u => daysAgo(u.updatedAt) <= 30).length;
    const new7 = users.filter(u => daysAgo(u.userSince) <= 7).length;
    const new30 = users.filter(u => daysAgo(u.userSince) <= 30).length;
    const dormant = users.filter(u => daysAgo(u.updatedAt) > 30).length;

    const totalBeds = sum(u => u.st.nBeds || 0);
    const totalPots = sum(u => arr(u,"pots").length);
    const totalHp = sum(u => arr(u,"hpPlants").length);
    const totalSeedlings = sum(u => arr(u,"seedlings").length);
    const totalDiary = sum(u => arr(u,"diary").length);
    const totalPhotos = sum(u => arr(u,"diary").filter(d => d && d.photo).length);
    const totalHarvestKg = sum(u => arr(u,"harvest").reduce((s,h) => s + (parseFloat(h.kg)||0), 0));
    const totalHarvestKs = sum(u => arr(u,"harvest").reduce((s,h) => s + (parseInt(h.ks)||0), 0));
    const totalHarvestRec = sum(u => arr(u,"harvest").length);
    const totalTrz = sum(u => arr(u,"trzMojeNabidky").length);
    const totalCredits = sum(u => (u.st.gkBalance || 0));

    // zapojeni: kolik uzivatelu vubec neco zalozilo
    const withData = users.filter(u => (u.st.nBeds||0) > 0 || arr(u,"pots").length || arr(u,"hpPlants").length).length;
    const emptyAccounts = totalUsers - withData;
    const avgBeds = totalUsers ? (totalBeds / totalUsers) : 0;
    const avgDiary = totalUsers ? (totalDiary / totalUsers) : 0;

    // vyuziti funkci (kolik % uzivatelu funkci pouziva)
    const usesFn = (fn) => totalUsers ? Math.round(users.filter(fn).length / totalUsers * 100) : 0;
    const featBeds = usesFn(u => (u.st.nBeds||0) > 0);
    const featPots = usesFn(u => arr(u,"pots").length > 0);
    const featHp = usesFn(u => arr(u,"hpPlants").length > 0);
    const featDiary = usesFn(u => arr(u,"diary").length > 0);
    const featHarvest = usesFn(u => arr(u,"harvest").length > 0);
    const featTrz = usesFn(u => arr(u,"trzMojeNabidky").length > 0);
    const featCompost = usesFn(u => arr(u,"compost").length > 0);
    const featSeed = usesFn(u => arr(u,"seedlings").length > 0);
    const featPhoto = usesFn(u => arr(u,"diary").some(d => d && d.photo));
    const featAI = usesFn(u => arr(u,"aiThreads").length > 0);

    // odhad velikosti dat
    const totalBytes = users.reduce((s,u) => s + JSON.stringify(u.st || {}).length, 0);
    const avgKb = totalUsers ? (totalBytes / totalUsers / 1024) : 0;

    document.getElementById("users-kpi").innerHTML = `
      <div class="kpi"><div class="kpi-label">👥 Celkem uživatelů</div><div class="kpi-val">${totalUsers}</div><div class="kpi-delta">${emptyAccounts} bez dat</div></div>
      <div class="kpi"><div class="kpi-label">💎 Premium</div><div class="kpi-val">${premiumOnly}</div><div class="kpi-delta">základní tarif</div></div><div class="kpi"><div class="kpi-label">🏆 Ultra</div><div class="kpi-val">${ultraUsers}</div><div class="kpi-delta ${ultraShare>=15?'up':''}">${ultraShare.toFixed(0)} % z platících</div></div><div class="kpi"><div class="kpi-label">📈 Konverze</div><div class="kpi-val">${convRate.toFixed(1)} %</div><div class="kpi-delta">${premiumUsers} platících</div></div>
      <div class="kpi"><div class="kpi-label">⚡ Aktivní 7 dní</div><div class="kpi-val">${active7}</div><div class="kpi-delta">${totalUsers?Math.round(active7/totalUsers*100):0} % ze všech</div></div>
      <div class="kpi"><div class="kpi-label">📅 Aktivní 30 dní</div><div class="kpi-val">${active30}</div><div class="kpi-delta">${dormant} neaktivních 30+ dní</div></div>
      <div class="kpi"><div class="kpi-label">🆕 Noví (7 / 30 dní)</div><div class="kpi-val">${new7} / ${new30}</div><div class="kpi-delta">registrací</div></div>
      <div class="kpi"><div class="kpi-label">🌱 Záhonů</div><div class="kpi-val">${totalBeds}</div><div class="kpi-delta">⌀ ${avgBeds.toFixed(1)} na uživatele</div></div>
      <div class="kpi"><div class="kpi-label">🪻 Květináčů</div><div class="kpi-val">${totalPots}</div></div>
      <div class="kpi"><div class="kpi-label">🪴 Pokojovek</div><div class="kpi-val">${totalHp}</div></div>
      <div class="kpi"><div class="kpi-label">🌿 Sazenic</div><div class="kpi-val">${totalSeedlings}</div></div>
      <div class="kpi"><div class="kpi-label">🧺 Sklizeň</div><div class="kpi-val">${totalHarvestKg.toFixed(1)} kg</div><div class="kpi-delta">${totalHarvestKs} ks · ${totalHarvestRec} záznamů</div></div>
      <div class="kpi"><div class="kpi-label">📓 Záznamů v deníku</div><div class="kpi-val">${totalDiary}</div><div class="kpi-delta">⌀ ${avgDiary.toFixed(1)} · ${totalPhotos} s fotkou</div></div>
      <div class="kpi"><div class="kpi-label">🛒 Inzerátů na tržišti</div><div class="kpi-val">${totalTrz}</div><div class="kpi-delta">${totalCredits} GK kreditů u uživatelů</div></div>
      <div class="kpi"><div class="kpi-label">💾 Objem dat</div><div class="kpi-val">${(totalBytes/1024/1024).toFixed(2)} MB</div><div class="kpi-delta">⌀ ${avgKb.toFixed(0)} kB na uživatele</div></div>
    `;

    // vyuziti funkci — pruhovy prehled
    const featEl = document.getElementById("feature-usage");
    if (featEl) {
      const feats = [
        ["🌱 Záhony", featBeds], ["🪻 Květináče", featPots], ["🪴 Pokojovky", featHp],
        ["📓 Deník", featDiary], ["🧺 Sklizeň", featHarvest], ["📷 Fotky", featPhoto],
        ["🌿 Sazenice", featSeed], ["♻️ Kompost", featCompost], ["🛒 Tržiště", featTrz], ["🤖 AI poradce", featAI],
      ].sort((a,b) => b[1]-a[1]);
      featEl.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;">${feats.map(([n,pct]) => `
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="flex:1;font-size:13px;">${n}</div>
          <div style="flex:2;height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#34d399,var(--primary));"></div>
          </div>
          <div style="width:44px;text-align:right;font-weight:700;font-size:12px;">${pct} %</div>
        </div>`).join("")}</div>`;
    }

    // registrace v case (12 mesicu)
    const regEl = document.getElementById("reg-chart");
    if (regEl) {
      const months = {};
      for (let i = 11; i >= 0; i--) { const d = new Date(); d.setMonth(d.getMonth()-i); months[d.toISOString().slice(0,7)] = 0; }
      users.forEach(u => { const m = (u.userSince||"").slice(0,7); if (m in months) months[m]++; });
      const maxM = Math.max(1, ...Object.values(months));
      regEl.innerHTML = `<div class="bars">${Object.entries(months).map(([m,n]) => `
        <div class="bar" title="${m}: ${n} registrací"><div class="bar-val">${n||''}</div>
        <div class="bar-fill" style="height:${Math.max(3, Math.round(n/maxM*110))}px"></div>
        <div class="bar-lbl">${m.slice(5)}</div></div>`).join("")}</div>`;
    }

    // ═══ BYZNYS: MRR, ARPU, churn ═══
    const monthlyValue = (u) => {
      const pi = u.premiumInfo || {};
      const t = _tier(u);
      if (t === "free") return 0;
      const amt = parseFloat(pi.amount) || 0;
      const plan = String(pi.plan || "").toLowerCase();
      const rocni = plan.includes("year") || plan.includes("rok") || amt >= 500;
      if (amt) return rocni ? amt / 12 : amt;
      // odhad podle urovne; stari zakaznici plati puvodni cenu
      if (t === "ultra") return rocni ? 2390 / 12 : 299;
      const stary = (pi.since || "") && (pi.since < "2026-08-13");
      return rocni ? (stary ? 990 : 1190) / 12 : (stary ? 99 : 149);
    };
    const mrrPremium = users.filter(u => _tier(u) === "premium").reduce((s,u) => s + monthlyValue(u), 0);
    const mrrUltra   = users.filter(u => _tier(u) === "ultra").reduce((s,u) => s + monthlyValue(u), 0);
    const mrr = users.reduce((s, u) => s + monthlyValue(u), 0);
    const arpu = totalUsers ? mrr / totalUsers : 0;
    const arppu = premiumUsers ? mrr / premiumUsers : 0;
    // churn: kdo měl Premium a vypršelo mu (a už není aktivní)
    const expiredPrem = users.filter(u => {
      const pi = u.premiumInfo || {};
      return !u.premium && pi.until && new Date(pi.until) < new Date();
    }).length;
    const everPrem = premiumUsers + expiredPrem;
    const churnRate = everPrem ? (expiredPrem / everPrem * 100) : 0;
    const stripeCnt = users.filter(u => u.premium && String((u.premiumInfo||{}).source||"").toLowerCase().includes("stripe")).length;

    // ═══ LTV (Lifetime Value) — appka měla ARPPU i churn, ale nikde
    // neukazovala, kolik v průměru vydělá jeden platící zákazník za CELOU
    // dobu, co u nás zůstane. Počítáno ze skutečných dat (since→until u
    // vypršelých), ne z odvozeného vzorce — přesnější, pokud dat je dost.
    const churnedDurations = users.filter(u => {
      const pi = u.premiumInfo || {};
      return !u.premium && pi.until && pi.since && new Date(pi.until) < new Date();
    }).map(u => {
      const pi = u.premiumInfo;
      const months = (new Date(pi.until) - new Date(pi.since)) / (30.44 * 86400000);
      return months;
    }).filter(m => m > 0 && m < 60); // ořež nesmyslné hodnoty (chybná data)
    const MIN_LTV_SAMPLES = 5; // pod tímhle je průměr nespolehlivý, appka je zatím mladá
    let avgLifespanMonths = null, ltv = null;
    if (churnedDurations.length >= MIN_LTV_SAMPLES) {
      avgLifespanMonths = churnedDurations.reduce((s,m) => s+m, 0) / churnedDurations.length;
      ltv = arppu * avgLifespanMonths;
    }

    // ═══ ZAPOJENÍ: skóre aktivity, power useři, stickiness ═══
    const engScore = (u) => (u.st.nBeds||0) + arr(u,"pots").length + arr(u,"hpPlants").length
      + arr(u,"diary").length * 0.5 + arr(u,"harvest").length * 0.5 + arr(u,"seedlings").length;
    const scored = users.map(u => ({ u, s: engScore(u) })).sort((a,b) => b.s - a.s);
    const power = scored.filter(x => x.s >= 20).length;
    const casual = scored.filter(x => x.s > 0 && x.s < 20).length;
    const active1 = users.filter(u => daysAgo(u.updatedAt) <= 1).length;
    const stickiness = active30 ? (active1 / active30 * 100) : 0;

    // ═══ TRIANGULACE: konverze na Premium podle používané funkce ═══
    const convBy = (label, pred) => {
      const yes = users.filter(pred);
      const no = users.filter(u => !pred(u));
      const plati = (u) => _tier(u) !== "free";
      const cy = yes.length ? yes.filter(plati).length / yes.length * 100 : 0;
      const cn = no.length ? no.filter(plati).length / no.length * 100 : 0;
      // kolik z tech, co funkci pouzivaji, si poridilo rovnou Ultra
      const cu = yes.length ? yes.filter(u => _tier(u) === "ultra").length / yes.length * 100 : 0;
      return { label, n: yes.length, cy, cn, cu, lift: cy - cn };
    };
    const triangles = [
      convBy("🛒 Tržiště", u => arr(u,"trzMojeNabidky").length > 0),
      convBy("🤖 AI poradce", u => arr(u,"aiThreads").length > 0),
      convBy("📷 Fotky v deníku", u => arr(u,"diary").some(d => d && d.photo)),
      convBy("🧺 Sklizeň", u => arr(u,"harvest").length > 0),
      convBy("🪴 Pokojovky", u => arr(u,"hpPlants").length > 0),
      convBy("♻️ Kompost", u => arr(u,"compost").length > 0),
      convBy("🌿 Sazenice", u => arr(u,"seedlings").length > 0),
      convBy("🏆 Level 5+", u => (u.st.level || 0) >= 5),
    ].sort((a,b) => b.lift - a.lift);

    // ═══ TRIANGULACE: retence podle aktivace ═══
    const activated = users.filter(u => (u.st.nBeds||0) > 0 || arr(u,"pots").length || arr(u,"hpPlants").length);
    const notActivated = users.filter(u => !((u.st.nBeds||0) > 0 || arr(u,"pots").length || arr(u,"hpPlants").length));
    const retAct = activated.length ? activated.filter(u => daysAgo(u.updatedAt) <= 30).length / activated.length * 100 : 0;
    const retNot = notActivated.length ? notActivated.filter(u => daysAgo(u.updatedAt) <= 30).length / notActivated.length * 100 : 0;
    // retence podle série (streak)
    const withStreak = users.filter(u => (u.st.streak || 0) >= 3);
    const retStreak = withStreak.length ? withStreak.filter(u => daysAgo(u.updatedAt) <= 30).length / withStreak.length * 100 : 0;

    // ═══ KOHORTY: retence podle měsíce registrace ═══
    const cohorts = {};
    users.forEach(u => {
      const m = (u.userSince || "").slice(0, 7);
      if (!m) return;
      if (!cohorts[m]) cohorts[m] = { total: 0, active: 0 };
      cohorts[m].total++;
      if (daysAgo(u.updatedAt) <= 30) cohorts[m].active++;
    });

    // ═══ SEZÓNNOST: aktivita v deníku a sklizni po měsících ═══
    const seasonD = {}, seasonH = {};
    for (let i = 1; i <= 12; i++) { seasonD[i] = 0; seasonH[i] = 0; }
    users.forEach(u => {
      arr(u,"diary").forEach(d => { const m = new Date(d.date || d.createdAt || 0).getMonth() + 1; if (m >= 1 && m <= 12) seasonD[m]++; });
      arr(u,"harvest").forEach(h => { const m = new Date(h.datum || 0).getMonth() + 1; if (m >= 1 && m <= 12) seasonH[m]++; });
    });

    // ═══ DOBA DO AKTIVACE (registrace → první záznam v deníku) ═══
    const ttaList = [];
    users.forEach(u => {
      const since = u.userSince ? new Date(u.userSince).getTime() : 0;
      if (!since) return;
      const first = arr(u,"diary").map(d => new Date(d.date || d.createdAt || 0).getTime()).filter(t => t > 0).sort((a,b) => a-b)[0];
      if (first && first >= since) ttaList.push((first - since) / 86400000);
    });
    ttaList.sort((a,b) => a-b);
    const ttaMed = ttaList.length ? ttaList[Math.floor(ttaList.length/2)] : null;
    const sameDay = ttaList.filter(d => d < 1).length;

    // ═══ CESTA K PRVNÍMU NÁKUPU (registrace → Premium) ═══
    const ttpList = [];
    users.forEach(u => {
      if (!u.premium && !(u.premiumInfo || {}).since) return;
      const reg = u.userSince ? new Date(u.userSince).getTime() : 0;
      const buyRaw = (u.premiumInfo || {}).since || u.st.premiumSince || "";
      const buy = buyRaw ? new Date(buyRaw).getTime() : 0;
      if (!reg || !buy || buy < reg) return;
      ttpList.push((buy - reg) / 86400000);
    });
    ttpList.sort((a, b) => a - b);
    const ttpMed = ttpList.length ? ttpList[Math.floor(ttpList.length / 2)] : null;
    const ttpBuckets = [
      ["Tentýž den", ttpList.filter(d => d < 1).length],
      ["Do týdne", ttpList.filter(d => d >= 1 && d < 7).length],
      ["Do měsíce", ttpList.filter(d => d >= 7 && d < 30).length],
      ["Po měsíci", ttpList.filter(d => d >= 30).length],
    ];

    // ═══ KRAJE: uživatelé vs. konverze na Premium ═══
    const regionStats = {};
    users.forEach(u => {
      const r = (u.st.region || u.st.kraj || "").trim() || "— nevyplněno —";
      if (!regionStats[r]) regionStats[r] = { total: 0, prem: 0, active: 0 };
      regionStats[r].total++;
      if (u.premium) regionStats[r].prem++;
      if (daysAgo(u.updatedAt) <= 30) regionStats[r].active++;
    });
    const regionRows = Object.entries(regionStats)
      .map(([name, s]) => ({ name, ...s, conv: s.total ? s.prem / s.total * 100 : 0 }))
      .sort((a, b) => b.total - a.total);

    // ═══ VYKRESLENÍ ═══
    const bizEl = document.getElementById("biz-kpi");
    if (bizEl) bizEl.innerHTML = `
      <div class="kpi"><div class="kpi-label">💰 MRR</div><div class="kpi-val">${Math.round(mrr).toLocaleString("cs-CZ")}</div><div class="kpi-delta">Premium ${Math.round(mrrPremium).toLocaleString("cs-CZ")} · Ultra ${Math.round(mrrUltra).toLocaleString("cs-CZ")} Kč</div></div>
      <div class="kpi"><div class="kpi-label">📈 Roční běh (ARR)</div><div class="kpi-val">${Math.round(mrr*12).toLocaleString("cs-CZ")}</div><div class="kpi-delta">Kč / rok</div></div>
      <div class="kpi"><div class="kpi-label">👤 ARPU</div><div class="kpi-val">${arpu.toFixed(1)}</div><div class="kpi-delta">Kč na uživatele</div></div>
      <div class="kpi"><div class="kpi-label">💎 ARPPU</div><div class="kpi-val">${Math.round(arppu)}</div><div class="kpi-delta">Kč na platícího</div></div>
      <div class="kpi"><div class="kpi-label">📉 Churn</div><div class="kpi-val">${churnRate.toFixed(0)} %</div><div class="kpi-delta">${expiredPrem} vypršelo z ${everPrem}</div></div>
      <div class="kpi"><div class="kpi-label">💰 LTV (odhad)</div><div class="kpi-val">${ltv != null ? Math.round(ltv).toLocaleString("cs-CZ") : "—"}</div><div class="kpi-delta">${ltv != null ? "Kč · ⌀ " + avgLifespanMonths.toFixed(1) + " měs. předplatné (" + churnedDurations.length + " vzorků)" : "zatím málo vypršelých (" + churnedDurations.length + "/" + MIN_LTV_SAMPLES + ")"}</div></div>
      <div class="kpi"><div class="kpi-label">💳 Přes Stripe</div><div class="kpi-val">${stripeCnt}</div><div class="kpi-delta">z ${premiumUsers} Premium</div></div>
      <div class="kpi"><div class="kpi-label">🔥 Power useři</div><div class="kpi-val">${power}</div><div class="kpi-delta">${casual} příležitostných</div></div>
      <div class="kpi"><div class="kpi-label">🧲 Stickiness</div><div class="kpi-val">${stickiness.toFixed(0)} %</div><div class="kpi-delta">denní / měsíční aktivita</div></div>
      <div class="kpi"><div class="kpi-label">⏱ Doba do 1. záznamu</div><div class="kpi-val">${ttaMed != null ? (ttaMed < 1 ? "< 1" : Math.round(ttaMed)) : "—"}</div><div class="kpi-delta">${ttaMed != null ? "dní (medián) · " + sameDay + "× hned" : "zatím bez dat"}</div></div>
      <div class="kpi"><div class="kpi-label">🛒 Cesta k nákupu</div><div class="kpi-val">${ttpMed != null ? (ttpMed < 1 ? "< 1" : Math.round(ttpMed)) : "—"}</div><div class="kpi-delta">${ttpMed != null ? "dní od registrace (medián)" : "zatím bez dat"}</div></div>
    `;

    const ttpEl = document.getElementById("ttp-dist");
    if (ttpEl) {
      const maxB = Math.max(1, ...ttpBuckets.map(b => b[1]));
      ttpEl.innerHTML = ttpList.length ? `
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${ttpBuckets.map(([lbl, n]) => `
            <div>
              <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
                <span>${lbl}</span><strong>${n}</strong>
              </div>
              <div style="height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden;">
                <div style="height:100%;width:${Math.round(n / maxB * 100)}%;background:linear-gradient(90deg,#fbbf24,#f59e0b);"></div>
              </div>
            </div>`).join("")}
        </div>
        <div style="font-size:11.5px;color:var(--ink-3);margin-top:12px;line-height:1.5;">Za jak dlouho od registrace si uživatelé pořídili Premium (${ttpList.length} ${ttpList.length === 1 ? "případ" : "případů"}).</div>`
        : '<div style="color:var(--ink-3);">Zatím žádná evidovaná konverze s datem.</div>';
    }

    const triEl = document.getElementById("tri-conv");
    if (triEl) triEl.innerHTML = triangles.map(t => `
      <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);">
        <div style="flex:1.2;font-size:13px;">${t.label}<div style="font-size:10.5px;color:var(--ink-3);">${t.n} uživatelů</div></div>
        <div style="flex:1;text-align:right;font-size:12px;"><strong>${t.cy.toFixed(0)} %</strong><div style="font-size:10.5px;color:var(--ink-3);">používá</div></div>
        <div style="flex:1;text-align:right;font-size:12px;color:var(--ink-3);">${t.cn.toFixed(0)} %<div style="font-size:10.5px;">nepoužívá</div></div>
        <div style="flex:0.8;text-align:right;font-size:12px;color:var(--warning);">${t.cu.toFixed(0)} %<div style="font-size:10.5px;color:var(--ink-3);">z toho Ultra</div></div>
        <div style="width:64px;text-align:right;font-weight:800;font-size:13px;color:${t.lift>0?'var(--primary)':t.lift<0?'var(--danger)':'var(--ink-3)'};">${t.lift>0?'+':''}${t.lift.toFixed(0)} b.</div>
      </div>`).join("") || '<div style="color:var(--ink-3);">Zatím málo dat.</div>';

    const retEl = document.getElementById("tri-ret");
    if (retEl) retEl.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${[["Založil si záhon / květináč / pokojovku", retAct, activated.length],
           ["Nezaložil nic", retNot, notActivated.length],
           ["Má sérii 3+ dní", retStreak, withStreak.length]].map(([lbl, pct, n]) => `
          <div>
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
              <span>${lbl} <span style="color:var(--ink-3);">(${n})</span></span><strong>${pct.toFixed(0)} %</strong>
            </div>
            <div style="height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden;">
              <div style="height:100%;width:${Math.min(100,pct)}%;background:linear-gradient(90deg,#34d399,var(--primary));"></div>
            </div>
          </div>`).join("")}
      </div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-top:12px;line-height:1.5;">Podíl uživatelů dané skupiny, kteří byli aktivní za posledních 30 dní.</div>`;

    const cohEl = document.getElementById("cohorts");
    if (cohEl) {
      const keys = Object.keys(cohorts).sort().slice(-12);
      cohEl.innerHTML = keys.length ? `<div style="display:flex;flex-direction:column;gap:7px;">${keys.map(k => {
        const co = cohorts[k]; const pct = co.total ? co.active/co.total*100 : 0;
        return `<div style="display:flex;align-items:center;gap:9px;font-size:12.5px;">
          <div style="width:62px;color:var(--ink-3);">${k}</div>
          <div style="flex:1;height:8px;background:var(--bg-2);border-radius:99px;overflow:hidden;">

    }

    const seaEl = document.getElementById("season");
    if (seaEl) {
      const mn = ["led","úno","bře","dub","kvě","črv","čvc","srp","zář","říj","lis","pro"];
      const maxS = Math.max(1, ...Object.values(seasonD), ...Object.values(seasonH));

        const m = i+1, hd = seasonD[m]||0, hh = seasonH[m]||0;

            <div class="bar-fill" style="height:${Math.max(2,Math.round(hh/maxS*100))}px;width:9px;background:linear-gradient(180deg,#fbbf24,#f59e0b);"></div>
          </div>
          <div class="bar-lbl">${nm}</div></div>`;

      uzivatele: {

        konverzePct: +convRate.toFixed(1),
        aktivni7: active7, aktivni30: active30, neaktivni30plus: dormant,
        novi7: new7, novi30: new30,
        powerUseri: power, prilezitostni: casual,
        stickinessPct: +stickiness.toFixed(1),

      obsah: {
        zahony: totalBeds, kvetinace: totalPots, pokojovky: totalHp, sazenice: totalSeedlings,

        inzeratyTrziste: totalTrz, gkKredityCelkem: totalCredits,
        prumerZahonuNaUzivatele: +avgBeds.toFixed(2), prumerZaznamuDeniku: +avgDiary.toFixed(2),

        zTohoUltraPct: +(t.cu||0).toFixed(1),
      })),

        zalozilNecoRetence30Pct: +retAct.toFixed(1), zalozilNecoPocet: activated.length,
        nezalozilNicRetence30Pct: +retNot.toFixed(1), nezalozilNicPocet: notActivated.length,
        serie3PlusRetence30Pct: +retStreak.toFixed(1), serie3PlusPocet: withStreak.length,
      },
      kohortyRetence: Object.fromEntries(Object.entries(cohorts).sort()
        .map(([m, o]) => [m, { registrovano: o.total, aktivnich30: o.active, retencePct: o.total ? +(o.active/o.total*100).toFixed(1) : 0 }])),
      sezonnost: { denikPoMesicich: seasonD, sklizenPoMesicich: seasonH },

    // TOP plodiny na zahonech
    const plantCount = {};

    document.getElementById("top-plants").innerHTML = renderTop(plantCount, "🌱");

    const hpCount = {};
    users.forEach(u => arr(u,"hpPlants").forEach(p => { const n = p && (p.name || p.species); if (n) hpCount[n] = (hpCount[n]||0)+1; }));
    document.getElementById("top-hp").innerHTML = renderTop(hpCount, "🪴");

    const pestCount = {};
    users.forEach(u => arr(u,"pestLog").forEach(p => { const n = p && (p.pestName || p.name); if (n) pestCount[n] = (pestCount[n]||0)+1; }));
    document.getElementById("top-pests").innerHTML = renderTop(pestCount, "🦟");

    // TOP rostliny v kvetinacich
    const potPlantCount = {};

      const list = (p && p.plants && p.plants.length) ? p.plants : (p && p.plant ? String(p.plant).split(",").map(s=>s.trim()) : []);

      ? renderTop(famCount, "🌾")

    // doplnit zebricky do exportu
    try {
      window._statsExport.topPlodinyZahony = topN(plantCount, 20);
      window._statsExport.topPokojovky = topN(hpCount, 20);
      window._statsExport.topSkudci = topN(pestCount, 15);
      window._statsExport.topRostlinyKvetinace = topN(potPlantCount, 20);
      window._statsExport.topSklizeneKg = topN(harvKg, 20);
    } catch(e) {}

    // Kraje: uzivatele + konverze + aktivita
    const regEl2 = document.getElementById("top-regions");
    if (regEl2) regEl2.innerHTML = regionRows.length ? `
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div style="display:flex;gap:8px;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding-bottom:6px;border-bottom:1px solid var(--line);">
          <div style="flex:1.6;">Kraj</div><div style="width:52px;text-align:right;">Uživ.</div>
          <div style="width:64px;text-align:right;">Premium</div><div style="width:56px;text-align:right;">Aktiv.</div>
        </div>
        ${regionRows.map(r => `
          <div style="display:flex;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);">
            <div style="flex:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.name === "— nevyplněno —" ? '<span style="color:var(--ink-3);">— nevyplněno —</span>' : "📍 " + r.name}</div>
            <div style="width:52px;text-align:right;font-weight:700;">${r.total}</div>
            <div style="width:64px;text-align:right;color:${r.conv>0?'var(--primary)':'var(--ink-3)'};font-weight:${r.conv>0?'700':'400'};">${r.prem} <span style="font-size:10.5px;">(${r.conv.toFixed(0)}%)</span></div>
            <div style="width:56px;text-align:right;color:var(--ink-3);">${r.active}</div>
          </div>`).join("")}
      </div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.5;">Aktiv. = aktivní za posledních 30 dní. Pomůže poznat, kde má smysl cílit reklamu.</div>`
      : '<div style="color:var(--ink-3);">Zatím žádná data o krajích.</div>';

  } catch(e) {
    document.getElementById("users-kpi").innerHTML = `<div class="kpi" style="grid-column:span 5;"><div class="kpi-label" style="color:var(--danger);">Chyba</div><div style="color:var(--ink-3);font-size:13px;margin-top:4px;">${e.message}</div></div>`;
  }
});

window._exportStats = async (mode) => {
  const d = window._statsExport;
  if (!d) { window.toast && window.toast("Statistiky se ještě načítají, zkus to za chvíli.", "warn"); return; }
  const json = JSON.stringify(d, null, 2);
  if (mode === "download") {
    const blob = new Blob([json], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `gardeeno-statistiky-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    window.toast && window.toast("Soubor stažen ✓", "ok");
  } else {
    try {
      await navigator.clipboard.writeText(json);
      window.toast && window.toast("Zkopírováno do schránky ✓ — můžeš vložit do chatu", "ok");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = json; ta.style.cssText = "position:fixed;top:5%;left:5%;width:90%;height:80%;z-index:99999;";
      document.body.appendChild(ta); ta.select();
      window.toast && window.toast("Označeno — zkopíruj přes Ctrl+C, pak klikni mimo", "warn");
      ta.addEventListener("blur", () => ta.remove());
    }
  }
};

function renderTop(map, icon) {
  const list = Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0,15);
  if (!list.length) return '<div style="color:var(--ink-3);padding:18px;text-align:center;">Žádná data</div>';
  const max = list[0][1];
  return `<div style="display:flex;flex-direction:column;gap:6px;">${list.map(([n,c]) => `
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="font-size:14px;">${icon}</div>
      <div style="flex:1;font-size:13px;">${n.replace(/</g,"&lt;")}</div>
      <div style="width:100px;height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden;">
        <div style="height:100%;width:${Math.round(c/max*100)}%;background:linear-gradient(90deg,#34d399,var(--primary));"></div>
      </div>
      <div style="width:36px;text-align:right;font-weight:700;font-size:12px;">${c}</div>
    </div>
  `).join("")}</div>`;
}
</script>


<script type="module">
const { db, collection, getDocs, doc, getDoc, setDoc } = window._fb;

const DB_DEFS = {
  agro: {
    label: "🌱 Plodiny — agro data",
    firestoreDoc: "databases/plodiny",
    fields: ["name","family","typ","pred","vys_d","vys","skl","rozestup","companions","enemies","tip"],
    fieldLabels: ["Název","Čeleď","Typ","Předpěst.","Výsev (dny)","Výsev","Sklizeň","Spon","Kamarádi","Nepřátelé","Tip"]
  },
  houseplants: {
    label: "🪴 Pokojovky",
    firestoreDoc: "databases/hp_db",
    fields: ["s","cz","icon","light","water","fert","temp","humid","toxic","diff","tip"],
    fieldLabels: ["Lat.","CZ","Ikona","Světlo","Zálivka","Hnojení","Teplota","Vlhkost","Jedovatá","Obtížnost","Tip"]
  },
  pots: {
    label: "🪻 Květináčové rostliny",
    firestoreDoc: "databases/pot_plants",
    fields: ["name","category","minD","minH","substrate","drainage","tip"],
    fieldLabels: ["Název","Kategorie","Min. ø","Min. hloubka","Substrát","Drenáž","Tip"]
  },
  pests: {
    label: "🦟 Škůdci & choroby",
    firestoreDoc: "databases/pest_db",
    fields: ["id","name","cat","icon","severity","plants","signs","organic","chemical"],
    fieldLabels: ["ID","Název","Kategorie","Ikona","Závažnost","Rostliny","Příznaky","Organicky","Chemicky"]
  },
  recipes: {
    label: "🍳 Recepty",
    firestoreDoc: "databases/recipe_db",
    fields: ["id","name","type","ingredients","time","difficulty","description"],
    fieldLabels: ["ID","Název","Typ","Ingredience","Čas","Obtížnost","Popis"]
  }
};

function makeDbPage(key) {
  return async (root) => {
    const def = DB_DEFS[key];
    root.innerHTML = `
      <div class="page-head">
        <div>
          <div class="page-title">${def.label}</div>
          <div class="page-sub">Firestore doc <code style="background:var(--bg-2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:11px;">${def.firestoreDoc}</code></div>
        </div>
        <div class="page-actions">
          <button class="btn btn-ghost" onclick="window._pages.${key}(document.getElementById('main'))">🔄 Aktualizovat</button>
          <button class="btn btn-primary" onclick="window._openDbItemEditor('${key}')">+ Nový záznam</button>
        </div>
      </div>
      <div class="tbl-wrap">
        <div class="tbl-head">
          <input type="text" class="tbl-search" placeholder="Hledej…" id="db-search-${key}">
          <div style="font-size:12px;color:var(--ink-3);" id="db-count-${key}">—</div>
        </div>
        <div id="db-loading-${key}" class="tbl-loading">⏳ Načítám…</div>
        <div id="db-tbl-${key}" style="display:none;"></div>
      </div>
    `;
    try {
      const docSnap = await getDoc(doc(db, def.firestoreDoc));
      const items = (docSnap.data()?.items) || [];
      window["_dbItems_" + key] = items;
      renderDbTbl(key);
      document.getElementById("db-search-" + key).addEventListener("input", e => { window["_dbSearch_" + key] = e.target.value; renderDbTbl(key); });
    } catch(e) { document.getElementById("db-loading-" + key).innerHTML = `❌ ${e.message}`; }
  };
}

function renderDbTbl(key) {
  const def = DB_DEFS[key];
  const items = window["_dbItems_" + key] || [];
  const q = (window["_dbSearch_" + key] || "").toLowerCase();
  const filtered = q ? items.filter(it => JSON.stringify(it).toLowerCase().includes(q)) : items;
  document.getElementById("db-count-" + key).textContent = `${filtered.length} z ${items.length}`;
  document.getElementById("db-loading-" + key).style.display = "none";
  document.getElementById("db-tbl-" + key).style.display = "";
  document.getElementById("db-tbl-" + key).innerHTML = filtered.length ? `
    <table>
      <thead><tr>${def.fieldLabels.map(l => `<th>${l}</th>`).join("")}<th style="text-align:right;">Akce</th></tr></thead>
      <tbody>
        ${filtered.slice(0,150).map((it, idx) => {
          const realIdx = items.indexOf(it);
          return `<tr>
            ${def.fields.map(f => `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;">${typeof it[f] === "object" ? JSON.stringify(it[f]).slice(0,40) : ((it[f]||"")+"").slice(0,80).replace(/</g,"&lt;")}</td>`).join("")}
            <td style="text-align:right;">
              <button class="btn btn-ghost" style="padding:4px 10px;min-height:28px;font-size:12px;" onclick="window._editDbItem('${key}', ${realIdx})">Upravit</button>
              <button class="btn btn-ghost" style="padding:4px 10px;min-height:28px;font-size:12px;color:var(--danger);" onclick="window._delDbItem('${key}', ${realIdx})">🗑</button>
            </td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    <div class="tbl-foot">${filtered.length} záznamů${filtered.length > 150 ? " (zobrazeno 150)" : ""}</div>
  ` : '<div class="tbl-empty">Žádné záznamy</div>';
}

window._openDbItemEditor = (key, idx) => {
  const def = DB_DEFS[key];
  const items = window["_dbItems_" + key] || [];
  const it = (idx !== undefined && idx >= 0) ? items[idx] : {};
  const isNew = idx === undefined || idx < 0;
  window.openModal(
    isNew ? `Nový záznam: ${def.label}` : `Úprava: ${it.name || it.cz || it.id || "?"}`,
    def.fields.map((f, i) => `
      <div class="field">
        <div class="field-label">${def.fieldLabels[i]}</div>
        <input class="field-input" id="dbf-${f}" value="${(typeof it[f] === "object" ? JSON.stringify(it[f]) : (it[f]||"")+"").replace(/"/g,"&quot;")}">
      </div>
    `).join(""),
    `<button class="btn btn-ghost" onclick="closeModal()">Zrušit</button>
     <button class="btn btn-primary" onclick="window._saveDbItem('${key}', ${idx === undefined ? -1 : idx})">Uložit</button>`
  );
};

window._editDbItem = (key, idx) => window._openDbItemEditor(key, idx);

window._saveDbItem = async (key, idx) => {
  const def = DB_DEFS[key];
  const items = window["_dbItems_" + key] || [];
  const newItem = {};
  def.fields.forEach(f => {
    let v = document.getElementById("dbf-" + f).value;
    if ((v.startsWith("{") && v.endsWith("}")) || (v.startsWith("[") && v.endsWith("]"))) { try { v = JSON.parse(v); } catch(e){} }
    else if (!isNaN(v) && v.trim() !== "" && (f === "water" || f === "fert" || f === "minD" || f === "minH")) v = parseInt(v);
    newItem[f] = v;
  });
  if (idx < 0) items.push(newItem);
  else items[idx] = newItem;
  try {
    await setDoc(doc(db, def.firestoreDoc), { items, updatedAt: new Date().toISOString(), count: items.length });
    renderDbTbl(key); closeModal(); window.toast("Uloženo", "success");
  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};

window._delDbItem = async (key, idx) => {
  const items = window["_dbItems_" + key] || [];
  const it = items[idx];
  if (!confirm(`Smazat ${it.name || it.cz || it.id || "záznam"}?`)) return;
  items.splice(idx, 1);
  try {
    await setDoc(doc(db, DB_DEFS[key].firestoreDoc), { items, updatedAt: new Date().toISOString(), count: items.length });
    renderDbTbl(key); window.toast("Smazáno", "success");
  } catch(e) { window.toast("Chyba: " + e.message, "error"); items.splice(idx, 0, it); }
};

Object.keys(DB_DEFS).forEach(k => window.registerPage(k, makeDbPage(k)));
</script>

window._impPreview = async (input) => {
  const file = input.files[0]; if (!file) return;
  try {
    const text = await file.text();
    const json = JSON.parse(text);
    const list = json.plants || [];
    const types = {}; list.forEach(p => { types[p.typ || "?"] = (types[p.typ||"?"]||0)+1; });
    document.getElementById("imp-preview").style.display = "";
    document.getElementById("imp-preview").innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
        <div><strong>${list.length}</strong> rostlin · <strong>${Math.round(text.length/1024)}</strong> KB</div>
        <div style="font-size:11px;color:var(--ink-3);">${file.name}</div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-bottom:10px;">Typy: ${Object.entries(types).sort((a,b) => b[1]-a[1]).slice(0,8).map(([t,n]) => `${t} (${n})`).join(" · ")}</div>
      <button class="btn btn-primary" onclick="window._startImport()" style="width:100%;">⬆️ Nahrát do Firestore (přepíše ${list.length} rostlin)</button>
    `;
    window._impData = list;
  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};

window._startImport = async () => {
  const items = window._impData || []; if (!items.length) return;
  if (!confirm(`Opravdu nahrát ${items.length} rostlin do Firestore? Existující záznamy se přepíšou.`)) return;
  const pr = document.getElementById("imp-progress");
  pr.style.display = ""; pr.innerHTML = '<div class="log" id="imp-log"></div>';
  const log = document.getElementById("imp-log");
  let ok = 0, err = 0;
  for (let i = 0; i < items.length; i++) {
    const p = items[i];
    const id = (p.id || p.name || `plant_${i}`).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
    try {
      await setDoc(doc(db, "plant_db", id), p);
      ok++;
      if (i % 25 === 0) { log.innerHTML += `<div class="log-line ok">[${i+1}/${items.length}] ${p.name} ✓</div>`; log.scrollTop = log.scrollHeight; }
    } catch(e) {
      err++;
      log.innerHTML += `<div class="log-line err">[${i+1}] ${p.name}: ${e.message}</div>`;
    }
  }
  log.innerHTML += `<div class="log-line ok" style="margin-top:8px;font-weight:700;">Hotovo: ${ok} OK, ${err} chyb</div>`;
  log.scrollTop = log.scrollHeight;
  window.toast(`Import dokončen: ${ok}/${items.length}`, err ? "error" : "success");
};

window._exportDb = async (name) => {
  window.toast(`Exportuju ${name}…`, "success");
  try {
    const snap = await getDocs(collection(db, name));
    const data = []; snap.forEach(d => data.push({ id: d.id, ...d.data() }));
    const blob = new Blob([JSON.stringify({ [name]: data, exportedAt: new Date().toISOString(), count: data.length }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `${name}_${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
    window.toast(`Exportováno ${data.length} záznamů`, "success");
  } catch(e) { window.toast("Chyba: " + e.message, "error"); }
};
</script>

<script type="module">
const { db, collection, getDocs, doc, getDoc, setDoc, updateDoc, query, orderBy, limit } = window._fb;

window.registerPage("premium", async (root) => {

    _users = [];

      let state = data;
      if (typeof data.data === "string") {
        try { state = JSON.parse(data.data); } catch(e) { state = {}; }

      _users.push({
        uid: d.id,
        email: state.userEmail || data.email || "—",
        name: state.userName || "—",
        // Premium čteme z TOP-LEVEL pole (admin ho tam píše), fallback na data JSON
        premium: data.premium === true || (data.premium === undefined && !!state.premium),

function isExpiringSoon(u) {
  if (!u.premium || !u.premiumInfo?.until) return false;
  const days = (new Date(u.premiumInfo.until) - Date.now()) / 86400000;
  return days > 0 && days < 30;
}

function isExpired(u) {
  if (!u.premiumInfo?.until) return false;
  return new Date(u.premiumInfo.until) < new Date();
}

let _sortKey = "";
let _sortDir = "asc";
function _sortArrow(key) {
  if (_sortKey !== key) return ' <span style="opacity:.28;font-size:10px;">↕</span>';
  return _sortDir === "asc" ? ' <span style="color:var(--primary);font-size:10px;">▲</span>'
                            : ' <span style="color:var(--primary);font-size:10px;">▼</span>';
}
// Nacte plant_db (1000+ dokumentu) az kdyz o to admin sam pozada
window._loadPlantHealth = async () => {
  const host = document.getElementById("admin-content-health");
  if (host) host.innerHTML = '<div style="text-align:center;padding:22px;color:var(--ink-3);">⏳ Načítám databázi rostlin…</div>';
  try {
    const { db, collection, getDocs } = window._fb;
    window._plantHealthSnap = await getDocs(collection(db, "plant_db"));
    if (window._pages && window._pages.dashboard) {
      await window._pages.dashboard(document.getElementById("main"));
    }
  } catch (e) {
    if (host) host.innerHTML = '<div style="padding:16px;color:var(--danger);">Nepodařilo se načíst: ' + e.message + '</div>';
  }
};

window._premSort = (key) => {
  if (_sortKey === key) _sortDir = (_sortDir === "asc") ? "desc" : "asc";
  else { _sortKey = key; _sortDir = "asc"; }
  renderPremTbl();
};

function renderPremTbl() {
  // KPI
  const tot = _users.length;
  const premium = _users.filter(u => tierOf(u) === "premium").length;
  const ultra = _users.filter(u => tierOf(u) === "ultra").length;
  const prem = premium + ultra;
  const exp = _users.filter(isExpiringSoon).length;
  const totalRevenue = _users.reduce((s, u) => s + (parseFloat(u.premiumInfo?.amount) || 0), 0);
  // MRR = mesicni hodnota vsech aktivnich predplatnych (rocni deleno 12)
  const mrr = _users.reduce((s, u) => s + tierPrice(u), 0);
  const arpu = prem ? mrr / prem : 0;
  document.getElementById("prem-kpi").innerHTML = `
    <div class="kpi"><div class="kpi-label">Uživatelů celkem</div><div class="kpi-val">${tot}</div><div class="kpi-delta">${tot - prem} bez předplatného</div></div>
    <div class="kpi"><div class="kpi-label">💎 Premium</div><div class="kpi-val">${premium}</div><div class="kpi-delta">${tot ? (premium/tot*100).toFixed(1) : 0} % ze všech</div></div>
    <div class="kpi"><div class="kpi-label">🏆 Ultra</div><div class="kpi-val">${ultra}</div><div class="kpi-delta">${prem ? Math.round(ultra/prem*100) : 0} % z platících</div></div>
    <div class="kpi"><div class="kpi-label">📈 Konverze</div><div class="kpi-val">${tot ? (prem/tot*100).toFixed(1) : 0} %</div><div class="kpi-delta">${prem} platících</div></div>
    <div class="kpi"><div class="kpi-label">💰 MRR</div><div class="kpi-val">${Math.round(mrr).toLocaleString("cs-CZ")}</div><div class="kpi-delta">Kč měsíčně</div></div>
    <div class="kpi"><div class="kpi-label">👤 ARPPU</div><div class="kpi-val">${Math.round(arpu)}</div><div class="kpi-delta">Kč na platícího</div></div>
    <div class="kpi"><div class="kpi-label">⏰ Brzy vyprší</div><div class="kpi-val">${exp}</div><div class="kpi-delta">do 30 dní</div></div>
    <div class="kpi"><div class="kpi-label">💵 Evidované platby</div><div class="kpi-val">${Math.round(totalRevenue).toLocaleString("cs-CZ")}</div><div class="kpi-delta">Kč celkem</div></div>
  `;

  let list = _users;
  if (_filter === "premium") list = list.filter(u => tierOf(u) === "premium");
  else if (_filter === "ultra") list = list.filter(u => tierOf(u) === "ultra");
  else if (_filter === "expiring") list = list.filter(isExpiringSoon);
  else if (_filter === "expired") list = list.filter(isExpired);
  else if (_filter === "free") list = list.filter(u => !u.premium);

  if (_search) {
    list = list.filter(u =>
      (u.email||"").toLowerCase().includes(_search) ||
      (u.name||"").toLowerCase().includes(_search) ||
      (u.uid||"").toLowerCase().includes(_search)
    );
  }

  // Řazení podle zvoleného sloupce
  if (_sortKey) {
    const val = (u) => {
      const pi = u.premiumInfo || {};
      switch (_sortKey) {
        case "email":  return (u.email || u.name || u.uid || "").toLowerCase();
        case "status": { const t = tierOf(u); return t === "ultra" ? 0 : t === "premium" ? 1 : (isExpired(u) ? 3 : 2); }
        case "plan":   return (pi.plan || "").toLowerCase();
        case "until":  return pi.until || "";
        case "amount": return parseFloat(pi.amount) || 0;
        case "source": return _isStripePremium(u) ? "stripe" : (pi.source || "").toLowerCase();
        case "usage":  return (u.nBeds || 0) + (u.nPlants || 0) + (u.nHarvest || 0) + (u.nDiary || 0);
        default:       return "";
      }
    };
    list = list.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      let r;
      if (typeof x === "number" && typeof y === "number") r = x - y;
      else r = String(x).localeCompare(String(y), "cs");
      return _sortDir === "asc" ? r : -r;
    });
  }

  document.getElementById("prem-count").textContent = `${list.length} z ${_users.length}`;
  document.getElementById("prem-loading").style.display = "none";
  document.getElementById("prem-tbl").style.display = "";
  // Mobilní kartové zobrazení (klikací)
  const cardsHtml = list.slice(0,200).map(u => {
    const pi = u.premiumInfo || {};
    const stat = u.premium

        ${list.slice(0,200).map(u => {

window._premFilter = (f) => {
  _filter = f;
  document.querySelectorAll("#prem-pills .pill").forEach(p => p.classList.remove("active"));
  document.querySelectorAll("#prem-pills .pill").forEach(p => { if (p.textContent.includes(({all:"Vše",ultra:"Ultra",premium:"Premium",expiring:"Brzy",expired:"Vypršelo",free:"Free"})[f] || "")) p.classList.add("active"); });

};

// Rozpozná, jestli Premium přišlo ze Stripe (= zákazník REÁLNĚ PLATÍ) nebo od admina.
// Webhook zapisuje source: checkout | invoice.paid | sub.updated | sub.deleted, případně customerId.
function _isStripePremium(pi) {
  if (!pi) return false;
  const s = String(pi.source || "");
  if (s === "stripe" || s.startsWith("checkout") || s.startsWith("invoice") || s.startsWith("sub.")) return true;
  if (pi.customerId || pi.stripeId) return true;
  return false;
}
// Uroven predplatneho: "free" | "premium" | "ultra"
function tierOf(u) {
  const pi = (u && u.premiumInfo) || {};
  const aktivni = (u && u.premium === true) || pi.active === true;
  if (!aktivni) return "free";
  return pi.tier === "ultra" ? "ultra" : "premium";
}
function tierChip(u) {
  const t = tierOf(u);
  if (t === "ultra")   return '<span class="chip" style="background:#fef3c7;color:#b45309;font-weight:800;">🏆 Ultra</span>';
  if (t === "premium") return '<span class="chip chip-primary">💎 Premium</span>';
  return '<span class="chip chip-muted">Free</span>';
}
function tierPrice(u) {
  const pi = (u && u.premiumInfo) || {};
  const t = tierOf(u);
  if (t === "free") return 0;
  const plan = String(pi.plan || "").toLowerCase();
  const rocni = plan.includes("year") || plan.includes("rok");
  const amt = parseFloat(pi.amount) || 0;
  if (amt) return rocni ? amt / 12 : amt;
  if (t === "ultra")   return rocni ? 2390 / 12 : 299;
  // stari zakaznici plati 99, novi 149 — odhad podle data
  const since = pi.since || "";
  const stary = since && since < "2026-08-13";
  return rocni ? (stary ? 990 : 1190) / 12 : (stary ? 99 : 149);
}

function _premBadge(pi) {
  if (!pi || !pi.active) return "";
  return _isStripePremium(pi)
    ? `<span class="chip chip-warn" title="Zákazník platí přes Stripe — neodebírej ručně!">💳 Platí (Stripe)</span>`
    : `<span class="chip chip-info" title="Premium udělené administrátorem">🎁 Od admina</span>`;
}

window._editPremium = (uid) => {
  const u = _users.find(x => x.uid === uid);
  if (!u) return;
  const pi = u.premiumInfo || {};
  window.openModal(
    `${tierOf(u) === "ultra" ? "🏆 Ultra" : "💎 Premium"} — ${u.email}`,
    `

        <option value="ultra" ${tierOf(u)==="ultra"?"selected":""}>🏆 Ultra</option>
      </select>
    </div>
    <div class="field"><div class="field-label">Plán</div>
      <select class="field-input" id="ep-plan">
        <option value="">— žádný —</option>
        <option value="monthly" ${pi.plan==="monthly"?"selected":""}>Měsíčně — Premium 149 Kč / Ultra 299 Kč</option>
        <option value="yearly" ${pi.plan==="yearly"?"selected":""}>Ročně — Premium 1 190 Kč / Ultra 2 390 Kč</option>
        <option value="legacy-monthly" ${pi.plan==="legacy-monthly"?"selected":""}>Měsíčně (původní 99 Kč)</option>
        <option value="legacy-yearly" ${pi.plan==="legacy-yearly"?"selected":""}>Ročně (původní 990 Kč)</option>
        <option value="lifetime" ${pi.plan==="lifetime"?"selected":""}>Doživotní</option>
        <option value="custom" ${pi.plan==="custom"?"selected":""}>Vlastní</option>
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field"><div class="field-label">Platí do (YYYY-MM-DD)</div>
        <input class="field-input" id="ep-until" type="date" value="${pi.until ? pi.until.slice(0,10) : ""}" placeholder="prázdné = lifetime">
      </div>
      <div class="field"><div class="field-label">Zaplaceno (Kč)</div>
        <input class="field-input" id="ep-amount" type="number" step="1" value="${pi.amount || ""}" placeholder="0">
      </div>
    </div>
    ${_isStripePremium(pi) ? `<div style="margin-bottom:14px;padding:12px 14px;border-radius:10px;background:var(--warning-soft);border:1px solid var(--warning);font-size:12.5px;line-height:1.5;color:var(--ink);">
      <strong>⚠️ Pozor: tento uživatel platí přes Stripe.</strong><br>
      Ruční odebrání Premium ho <u>nezruší ve Stripe</u> — zákazník bude platit dál a při příští platbě se mu Premium samo vrátí.
      Chceš-li předplatné opravdu ukončit, zruš ho ve <a href="https://dashboard.stripe.com/subscriptions" target="_blank" rel="noopener" style="color:var(--primary);">Stripe dashboardu</a>.
    </div>` : ""}
    <div class="field"><div class="field-label">Zdroj platby</div>
      <select class="field-input" id="ep-source">
        <option value="gift" ${(pi.source==="gift"||!pi.source)?"selected":""}>🎁 Dárek / promo</option>
        <option value="manual" ${pi.source==="manual"?"selected":""}>🤝 Manuální (bankovní převod)</option>
        <option value="trial" ${pi.source==="trial"?"selected":""}>⏱ Trial (zkušební)</option>
        <option value="lifetime" ${pi.source==="lifetime"?"selected":""}>🌟 Lifetime (early supporter)</option>
        <option value="stripe" ${pi.source==="stripe"?"selected":""}>💳 Stripe (online) — appka tohle nastavuje sama, nevybírej ručně</option>
      </select>
    </div>
    <div class="field"><div class="field-label">Stripe ID (pokud je)</div>
      <input class="field-input" id="ep-stripe" value="${pi.stripeId || ""}" placeholder="cus_… nebo sub_…">

      <textarea class="field-input" id="ep-note">${(pi.note || "").replace(/</g,"&lt;")}</textarea>

    <div style="font-size:11px;color:var(--ink-3);padding:10px;background:var(--bg-2);border-radius:8px;line-height:1.5;">
      ℹ️ Změna se uloží do <code>users/${uid}</code> → state.premiumInfo. Klientská app si to při dalším syncu přečte. Stripe samotný neovlivňujeme — to je oddělená evidence.
    </div>
    <div style="margin-top:14px;padding:10px;background:var(--bg-2);border-radius:8px;display:flex;gap:8px;flex-wrap:wrap;">

      <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;min-height:28px;" onclick="window._quickPrem('${uid}', 'trial', 14)">⏱ Trial 14 dní</button>
      <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;min-height:28px;" onclick="window._quickPrem('${uid}', 'lifetime', null)">🌟 Lifetime</button>
      <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;min-height:28px;color:var(--danger);" onclick="window._quickPrem('${uid}', 'revoke', null)">⛔ Zrušit Premium</button>
    </div>
    `,
    `<button class="btn btn-ghost" onclick="closeModal()">Zrušit</button>
     <button class="btn btn-primary" onclick="window._savePremium('${uid}')">Uložit změny</button>`
  );
};

window._quickPrem = async (uid, type, days) => {
  const u = _users.find(x => x.uid === uid);
  if (!u) return;
  let pi = { ...(u.premiumInfo || {}) };
  let active = u.premium;

  if (type === "revoke") {
    if (!confirm(`Zrušit Premium uživateli ${u.email}?`)) return;
    active = false;
    pi.until = new Date().toISOString();
    pi.note = (pi.note || "") + `\n[${new Date().toISOString().slice(0,10)}] Admin revoke`;
  } else if (type === "lifetime") {
    active = true;
    pi = { plan: "lifetime", source: "lifetime", amount: 2490, lifetime: true, since: new Date().toISOString() };
  } else {
    active = true;
    const until = new Date(); until.setDate(until.getDate() + days);
    pi.plan = pi.plan || (days === 365 ? "yearly" : "monthly");
    pi.source = type;
    pi.since = new Date().toISOString();
    pi.until = until.toISOString();
    pi.note = (pi.note || "") + `\n[${new Date().toISOString().slice(0,10)}] Admin ${type} ${days}d`;
  }
  await _writePremium(uid, active, pi);
  closeModal();
  window._pages.premium(document.getElementById("main"));
};

window._savePremium = async (uid) => {
  const volba = document.getElementById("ep-active").value;   // "false" | "true" | "ultra"
  const active = (volba === "true" || volba === "ultra");
  const zvolenyTier = (volba === "ultra") ? "ultra" : "premium";
  // Pojistka: odebrání Premium platícímu zákazníkovi (Stripe) je téměř vždy omyl —
  // ve Stripe mu předplatné běží dál a při další platbě se Premium samo vrátí.
  const _u = _users.find(x => x.uid === uid);
  if (!active && _isStripePremium(_u?.premiumInfo)) {
    const ok = confirm(
      "⚠️ POZOR: Tento uživatel platí přes Stripe.\n\n" +
      "Ručním odebráním Premium se jeho předplatné ve Stripe NEZRUŠÍ — bude platit dál " +
      "a při příští platbě mu Premium naskočí zpátky.\n\n" +
      "Chceš-li předplatné opravdu ukončit, zruš ho ve Stripe dashboardu.\n\n" +
      "Opravdu pokračovat v ručním odebrání?"
    );
    if (!ok) return;
  }
  const pi = {
    tier: active ? zvolenyTier : null,
    plan: document.getElementById("ep-plan").value || null,
    until: document.getElementById("ep-until").value ? new Date(document.getElementById("ep-until").value).toISOString() : null,
    amount: parseFloat(document.getElementById("ep-amount").value) || null,
    source: document.getElementById("ep-source").value,
    stripeId: document.getElementById("ep-stripe").value || null,
    note: document.getElementById("ep-note").value || null,
    since: _users.find(x=>x.uid===uid)?.premiumInfo?.since || new Date().toISOString(),
    updatedBy: "admin",
    updatedAt: new Date().toISOString()
  };
  if (pi.plan === "lifetime") pi.lifetime = true;
  await _writePremium(uid, active, pi);
  closeModal();
  window._pages.premium(document.getElementById("main"));
};

async function _writePremium(uid, active, premiumInfo) {
  try {
    // Tady je trik: state je uložen jako JSON.stringify(state) v poli "data"
    // Musíme načíst, parse-nout, upravit a uložit zpět. Čteme ze serveru (ne cache).
    const _ref = doc(db, "users", uid);
    let userDoc;
    try { userDoc = window._fb.getDocFromServer ? await window._fb.getDocFromServer(_ref) : await getDoc(_ref); }
    catch(e) { userDoc = await getDoc(_ref); }
    if (!userDoc.exists()) { window.toast("Uživatel neexistuje v users/", "error"); return; }
    const raw = userDoc.data();
    let state = {};
    if (typeof raw.data === "string") { try { state = JSON.parse(raw.data); } catch(e) { state = {}; } }
    else state = raw;

    state.premium = active;
    state.premiumInfo = premiumInfo;
    if (active && !state.premiumSince) state.premiumSince = premiumInfo.since;
    // KLÍČOVÉ: bumpnout updatedAt tak, aby klient při dalším načtení viděl novější data
    // než jeho lokální lastSync (jinak merge ve loadCloudData změnu zahodí).
    const newTs = new Date(Date.now() + 1000).toISOString(); // +1s pojistka
    // Vnitřní lastSync NEbumpovat — necháme cloud novější přes top-level updatedAt

    // Uložit zpět ve stejném formátu, ve kterém to bylo (string data nebo top-level fields)
    if (typeof raw.data === "string") {
      await updateDoc(doc(db, "users", uid), {
        data: JSON.stringify(state),
        premium: active,
        premiumInfo: premiumInfo,
        updatedAt: newTs
      });
    } else {
      await updateDoc(doc(db, "users", uid), {
        premium: active,
        premiumInfo: premiumInfo,
        updatedAt: newTs
      });
    }
    window.toast(`Premium ${active ? "aktivován ✓ — projeví se po obnovení appky uživatele" : "zrušen ✓"}`, "success");
  } catch(e) {
    console.error("[Premium write]", e);
    if (e.code === "permission-denied" || /permission/i.test(e.message)) {
      window.toast("⛔ Firestore pravidla blokují zápis. Nasaď firestore.rules (viz instrukce).", "error");
    } else {
      window.toast("Chyba ukládání: " + e.message, "error");
    }
  }
}
window._writePremium = _writePremium;
</script>


<script>
// BUG 2: Mobilní sidebar toggle
(function() {
  function bindMobMenu() {
    const btn = document.getElementById("mob-menu-btn");
    const sb = document.querySelector(".sb");
    const overlay = document.getElementById("sb-overlay");
    if (!btn || !sb || !overlay) return;
    const close = () => { sb.classList.remove("open"); overlay.classList.remove("show"); };
    const open = () => { sb.classList.add("open"); overlay.classList.add("show"); };
    btn.addEventListener("click", () => sb.classList.contains("open") ? close() : open());
    overlay.addEventListener("click", close);
    // Delegace — funguje i pro položky přidané později
    sb.addEventListener("click", (e) => { if (e.target.closest(".sb-item")) close(); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bindMobMenu);
  else bindMobMenu();
})();
</script>

<script type="module">
const { db, collection, getDocs, doc, deleteDoc, updateDoc, query, orderBy, limit } = window._fb;
let _bc = [];
let _bcFilter = "all";
let _bcSearch = "";

window.registerPage("blogcom", async (root) => {
  root.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">📝 Blog — diskuze</div>
        <div class="page-sub">Komentáře pod články: moderace, skrytí a mazání</div>
      </div>
      <button class="btn btn-ghost" onclick="window._pages.blogcom(document.getElementById('main'))">🔄 Aktualizovat</button>
    </div>
    <div class="kpi-grid" id="bc-kpi"></div>
    <div class="pills" id="bc-pills"></div>
    <div class="tbl-wrap">
      <div class="tbl-head">
        <input type="text" class="tbl-search" placeholder="Hledej v textu, autorovi nebo článku…" id="bc-search">

      <div id="bc-tbl" style="display:none;"></div>
    </div>
  `;
  try {
    const snap = await getDocs(query(collection(db, "blog_comments"), orderBy("createdAt", "desc"), limit(500)));
    _bc = [];
    snap.forEach(d => _bc.push({ id: d.id, ...d.data() }));
    renderBc();
  } catch (e) {
    document.getElementById("bc-loading").innerHTML = `❌ Chyba: ${e.message}`;
  }
  document.getElementById("bc-search").addEventListener("input", e => { _bcSearch = e.target.value.toLowerCase(); renderBc(); });
});

function bcEsc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function bcAgo(iso) {
  if (!iso) return "—";
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 3600) return `před ${Math.max(1,Math.floor(s/60))} min`;
  if (s < 86400) return `před ${Math.floor(s/3600)} h`;
  if (s < 2592000) return `před ${Math.floor(s/86400)} dny`;
  return new Date(iso).toLocaleDateString("cs-CZ");
}

function renderBc() {
  const visible = _bc.filter(x => x.status !== "hidden").length;
  const hidden = _bc.length - visible;
  const d7 = Date.now() - 7*86400000;
  const new7 = _bc.filter(x => new Date(x.createdAt || 0).getTime() > d7).length;
  const byArticle = {};
  _bc.forEach(x => { const k = x.slug || "?"; byArticle[k] = (byArticle[k]||0)+1; });
  const topArt = Object.entries(byArticle).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById("bc-kpi").innerHTML = `
    <div class="kpi"><div class="kpi-label">💬 Komentářů</div><div class="kpi-val">${_bc.length}</div><div class="kpi-delta">${new7} za 7 dní</div></div>
    <div class="kpi"><div class="kpi-label">👁 Zobrazených</div><div class="kpi-val">${visible}</div></div>
    <div class="kpi"><div class="kpi-label">🙈 Skrytých</div><div class="kpi-val">${hidden}</div></div>
    <div class="kpi"><div class="kpi-label">🔥 Nejdiskutovanější</div><div class="kpi-val" style="font-size:15px;">${topArt ? bcEsc(topArt[0]) : "—"}</div><div class="kpi-delta">${topArt ? topArt[1] + " komentářů" : ""}</div></div>
  `;

  const counts = { all: _bc.length, visible, hidden };
  document.getElementById("bc-pills").innerHTML = [
    ["all","Vše"], ["visible","Zobrazené"], ["hidden","Skryté"]
  ].map(([k,l]) => `<button class="pill ${_bcFilter===k?"active":""}" onclick="window._bcFilterSet('${k}')">${l} <span class="pill-n">${counts[k]}</span></button>`).join("");

  let list = _bc;
  if (_bcFilter === "visible") list = list.filter(x => x.status !== "hidden");
  else if (_bcFilter === "hidden") list = list.filter(x => x.status === "hidden");
  if (_bcSearch) list = list.filter(x =>
    (x.text||"").toLowerCase().includes(_bcSearch) ||
    (x.name||"").toLowerCase().includes(_bcSearch) ||
    (x.slug||"").toLowerCase().includes(_bcSearch));

  document.getElementById("bc-count").textContent = `${list.length} z ${_bc.length}`;
  document.getElementById("bc-loading").style.display = "none";
  const tbl = document.getElementById("bc-tbl");
  tbl.style.display = "";
  tbl.innerHTML = list.length ? `
    <table class="tbl">
      <thead><tr><th>Autor</th><th>Komentář</th><th>Článek</th><th>Kdy</th><th style="text-align:right;">Akce</th></tr></thead>
      <tbody>
        ${list.slice(0,300).map(x => `
          <tr style="${x.status==="hidden"?"opacity:.55;":""}">
            <td style="white-space:nowrap;">${bcEsc(x.name||"?")}</td>
            <td style="max-width:420px;">${bcEsc(x.text||"").slice(0,300)}${(x.text||"").length>300?"…":""}</td>
            <td><a href="https://gardeeno.cz/blog/${bcEsc(x.slug||"")}" target="_blank" rel="noopener" style="color:var(--primary);">${bcEsc(x.slug||"?")}</a></td>
            <td style="white-space:nowrap;color:var(--ink-3);">${bcAgo(x.createdAt)}</td>
            <td style="text-align:right;white-space:nowrap;">
              <button class="btn btn-ghost btn-sm" onclick="window._bcToggle('${x.id}')">${x.status==="hidden"?"👁 Zobrazit":"🙈 Skrýt"}</button>
              <button class="btn btn-ghost btn-sm" onclick="window._bcDelete('${x.id}')" style="color:var(--danger);">🗑</button>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>` : '<div class="tbl-loading">Žádné komentáře neodpovídají filtru.</div>';

  const badge = document.getElementById("badge-blogcom");
  if (badge) { if (new7 > 0) { badge.textContent = new7; badge.style.display = ""; } else badge.style.display = "none"; }
}

window._bcFilterSet = (k) => { _bcFilter = k; renderBc(); };
window._bcToggle = async (id) => {
  const it = _bc.find(x => x.id === id); if (!it) return;
  const next = it.status === "hidden" ? "visible" : "hidden";
  try {
    await updateDoc(doc(db, "blog_comments", id), { status: next });
    it.status = next; renderBc();
    window.toast && window.toast(next === "hidden" ? "Komentář skryt" : "Komentář zobrazen", "ok");
  } catch (e) { window.toast && window.toast("Nepodařilo se uložit: " + e.message, "warn"); }
};
window._bcDelete = async (id) => {
  if (!confirm("Opravdu trvale smazat tento komentář?")) return;
  try {
    await deleteDoc(doc(db, "blog_comments", id));
    _bc = _bc.filter(x => x.id !== id); renderBc();
    window.toast && window.toast("Komentář smazán", "ok");
  } catch (e) { window.toast && window.toast("Smazání selhalo: " + e.message, "warn"); }
};
</script>


<script type="module">
const { db, auth, collection, getDocs, doc, updateDoc, query, orderBy, limit } = window._fb;

const RADAR_RUN_ENDPOINT = "https://forumradarrunnow-p6aspax46q-ew.a.run.app";
const RADAR_STATUS_LABELS = { navrh: "Návrh", schvaleno: "Ke schválení", odeslano: "Odesláno", zamitnuto: "Zamítnuto" };
let _radarItems = [];
let _radarFilterVal = "active"; // active = vše kromě zamítnutých

function radarEsc(s) { return String(s == null ? "" : s).replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c])); }

window.registerPage("radar", async (root) => {
  root.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">📡 Fórum radar</div>
        <div class="page-sub">Návrhy odpovědí z veřejných fór — nic se neposílá samo, odeslání je vždy na tobě</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" id="radar-run-btn" onclick="window._radarRunNow()">🔄 Spustit sken teď</button>
      </div>
    </div>
    <div class="kpi-mini-grid" id="radar-kpis"></div>
    <div class="pills" id="radar-pills"></div>
    <div id="radar-loading" class="tbl-loading">⏳ Načítám…</div>
    <div id="radar-list" style="display:none;"></div>
  `;
  await radarLoad();
});

async function radarLoad() {
  try {
    const snap = await getDocs(query(collection(db, "forum_radar"), orderBy("foundAt", "desc"), limit(300)));
    _radarItems = [];
    snap.forEach(d => _radarItems.push({ id: d.id, ...d.data() }));
    // Vlastní vlákna a vyšší skóre nahoru
    _radarItems.sort((a, b) => (b.ownThread === a.ownThread ? (b.score||0) - (a.score||0) : (b.ownThread ? 1 : -1)));
    renderRadar();
  } catch (e) {
    document.getElementById("radar-loading").innerHTML = `❌ ${e.message}`;
  }
}

function renderRadar() {
  const counts = { navrh: 0, schvaleno: 0, odeslano: 0, zamitnuto: 0, own: 0 };
  _radarItems.forEach(it => { counts[it.status] = (counts[it.status]||0) + 1; if (it.ownThread) counts.own++; });

  document.getElementById("radar-kpis").innerHTML = `
    <div class="kpi-mini"><div class="kpi-mini-icon">🆕</div><div><div class="kpi-mini-val">${counts.navrh||0}</div><div class="kpi-mini-label">Čeká na tebe</div></div></div>
    <div class="kpi-mini"><div class="kpi-mini-icon">🎯</div><div><div class="kpi-mini-val">${counts.own||0}</div><div class="kpi-mini-label">Tvoje vlastní vlákna</div></div></div>
    <div class="kpi-mini"><div class="kpi-mini-icon">✅</div><div><div class="kpi-mini-val">${counts.odeslano||0}</div><div class="kpi-mini-label">Odesláno</div></div></div>
    <div class="kpi-mini"><div class="kpi-mini-icon">✖</div><div><div class="kpi-mini-val">${counts.zamitnuto||0}</div><div class="kpi-mini-label">Zamítnuto</div></div></div>
  `;

  document.getElementById("radar-pills").innerHTML = `
    <button class="pill ${_radarFilterVal==="active"?"active":""}" onclick="window._radarFilterSet('active')">Aktivní (${_radarItems.length - (counts.zamitnuto||0)})</button>
    <button class="pill ${_radarFilterVal==="navrh"?"active":""}" onclick="window._radarFilterSet('navrh')">Návrh (${counts.navrh||0})</button>
    <button class="pill ${_radarFilterVal==="odeslano"?"active":""}" onclick="window._radarFilterSet('odeslano')">Odesláno (${counts.odeslano||0})</button>
    <button class="pill ${_radarFilterVal==="zamitnuto"?"active":""}" onclick="window._radarFilterSet('zamitnuto')">Zamítnuto (${counts.zamitnuto||0})</button>
    <button class="pill ${_radarFilterVal==="all"?"active":""}" onclick="window._radarFilterSet('all')">Vše</button>
  `;

  let list = _radarItems;
  if (_radarFilterVal === "active") list = list.filter(i => i.status !== "zamitnuto");
  else if (_radarFilterVal !== "all") list = list.filter(i => i.status === _radarFilterVal);

  document.getElementById("radar-loading").style.display = "none";
  const root = document.getElementById("radar-list");
  root.style.display = "";

  if (!list.length) {
    root.innerHTML = `<div class="card" style="text-align:center;color:var(--ink-3);padding:40px;">Nic tu není. Zkus spustit sken, nebo změň filtr.</div>`;
    return;
  }

  root.innerHTML = list.map(it => {
    const scoreClass = it.score >= 80 ? "chip-primary" : it.score >= 60 ? "chip-warn" : "chip-muted";
    const statusClass = it.status === "odeslano" ? "chip-primary" : it.status === "zamitnuto" ? "chip-danger" : it.status === "schvaleno" ? "chip-info" : "chip-muted";
    return `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
        ${it.ownThread ? '<span class="chip chip-warn">🎯 Tvoje vlákno</span>' : ""}
        <span class="chip chip-muted">${radarEsc(it.sourceLabel||"?")}</span>
        <span class="chip ${scoreClass}">Skóre ${it.score||0}</span>
        <span class="chip ${statusClass}">${RADAR_STATUS_LABELS[it.status]||it.status}</span>
      </div>
      <div style="font-weight:700;font-size:14.5px;margin-bottom:4px;">
        <a href="${radarEsc(it.threadUrl)}" target="_blank" rel="noopener" style="color:var(--ink);">${radarEsc(it.threadTitle)}</a>
      </div>
      <div style="color:var(--ink-3);font-size:12.5px;margin-bottom:10px;">${radarEsc(it.excerpt||"")}${it.lastActivity ? " · " + radarEsc(it.lastActivity) : ""}</div>
      <textarea id="radar-draft-${it.id}" style="width:100%;min-height:90px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font-size:13px;font-family:inherit;margin-bottom:8px;resize:vertical;">${radarEsc(it.draftReply||"")}</textarea>
      ${it.mentionGardeeno ? "" : `<div style="font-size:11.5px;color:var(--ink-3);margin-bottom:8px;">ℹ️ Gardeeno se tu záměrně nezmiňuje — buď to pravidla zdroje nedovolují, nebo se to k dotazu nehodilo. ${radarEsc(it.notes||"")}</div>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="window._radarCopyOpen('${it.id}')">📋 Kopírovat + otevřít vlákno</button>
        <button class="btn btn-ghost" onclick="window._radarSaveDraft('${it.id}')">💾 Uložit úpravu</button>
        <button class="btn btn-soft" onclick="window._radarSetStatus('${it.id}','odeslano')">✅ Označit odesláno</button>
        <button class="btn btn-ghost" style="color:var(--danger);" onclick="window._radarSetStatus('${it.id}','zamitnuto')">✖ Zamítnout</button>
      </div>
    </div>`;
  }).join("");
}

window._radarFilterSet = (v) => { _radarFilterVal = v; renderRadar(); };

window._radarCopyOpen = async (id) => {
  const it = _radarItems.find(x => x.id === id); if (!it) return;
  const ta = document.getElementById("radar-draft-" + id);
  const text = ta ? ta.value : (it.draftReply || "");
  try { await navigator.clipboard.writeText(text); window.toast("Text zkopírován, otevírám vlákno…", "success"); }
  catch (e) { window.toast("Kopírování se nepovedlo, zkopíruj ručně", "warn"); }
  window.open(it.threadUrl, "_blank", "noopener");
  if (it.status === "navrh") window._radarSetStatus(id, "schvaleno");
};

window._radarSaveDraft = async (id) => {
  const ta = document.getElementById("radar-draft-" + id);
  if (!ta) return;
  try {
    await updateDoc(doc(db, "forum_radar", id), { draftReply: ta.value });
    const it = _radarItems.find(x => x.id === id); if (it) it.draftReply = ta.value;
    window.toast("Návrh uložen", "success");
  } catch (e) { window.toast("Uložení selhalo: " + e.message, "error"); }
};

window._radarSetStatus = async (id, status) => {
  try {
    await updateDoc(doc(db, "forum_radar", id), { status });
    const it = _radarItems.find(x => x.id === id); if (it) it.status = status;
    renderRadar();
    window.toast(status === "odeslano" ? "Označeno jako odesláno ✅" : status === "zamitnuto" ? "Zamítnuto" : "Uloženo", "success");
  } catch (e) { window.toast("Nepodařilo se uložit: " + e.message, "error"); }
};

window._radarRunNow = async () => {
  const btn = document.getElementById("radar-run-btn");
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Kontroluju fóra…"; }
  try {
    const token = await auth.currentUser.getIdToken();
    const res = await fetch(RADAR_RUN_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || ("HTTP " + res.status));
    window.toast(`Hotovo — nalezeno ${data.found||0}, nových ${data.created||0}`, "success");
    await radarLoad();
  } catch (e) {
    window.toast("Sken selhal: " + e.message, "error");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "🔄 Spustit sken teď"; }
  }
};
</script>
</body>
</html>
